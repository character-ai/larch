name: CI

on:
  workflow_dispatch:
    inputs:
      coverage_profile_benchmark:
        description: Run the opt-level and nextest-thread coverage profile sweep
        required: false
        default: false
        type: boolean
      coverage_profile_runner:
        description: Runner to compare for the manually dispatched coverage profile sweep
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - large_ubuntu_4cpu
      coverage_target_cache_benchmark:
        description: Run the isolated main-only coverage target-cache comparison job
        required: false
        default: false
        type: boolean
      coverage_target_cache_benchmark_max_bytes:
        description: Exact measured dependency-only byte bound for the target-cache benchmark (0 measures only)
        required: false
        default: "0"
        type: string
      rust_phase_overlap_benchmark:
        description: Run paired sequential and parallel Rust test-policy coverage samples
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A merge queue validates an integration candidate on a temporary ref. Keep
  # this separate from pull_request so every required check reports on the
  # candidate SHA before GitHub advances main.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Force all JavaScript-based actions (including transitive sub-actions like
  # the actions/cache@v4 carried inside actions/setup-node and
  # actions/setup-python) to run under Node.js 24.  Suppresses the deprecation
  # warning that fires on every job:
  #   "Node.js 20 actions are deprecated."
  # Per GitHub release notes 2025-09-19, Node 20 is removed from runners on
  # 2026-09-16; this env var becomes the default on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Partial and skip completed their independent pull-request observation
  # windows with zero false-safe decisions. Both still fall back to full on
  # any selector or trust failure.
  RUST_CI_PARTIAL_ENFORCEMENT: "true"
  RUST_CI_SKIP_ENFORCEMENT: "true"

jobs:
  # External-tool linters only: markdownlint, jsonlint, and actionlint.
  # Local bash linters run in the parallel `lint-local` job.
  # `agent-lint`, `agnix`, `lintlang`, and `shellcheck` run in their dedicated jobs.
  # `gitleaks` working-tree scan moved to the `gitleaks` job to shed ~40s
  # from this job's critical path. Test harnesses run in the separate
  # `test-harnesses` job.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
            !/plugin/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: pip-lint-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.main-cache-keys.outputs.pip-lint }}
      - id: pre-commit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.main-cache-keys.outputs.pre-commit }}
      - name: Install lint dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "30"
        run: pip install -r .github/workflows/requirements-lint.txt
      - name: Run pre-commit linters (external tools)
        # Runs markdownlint, jsonlint, and actionlint only.
        # `agent-lint`, `agnix`, `lintlang`, and `shellcheck` run in dedicated jobs.
        # `gitleaks` moved to the `gitleaks` job. Local bash linters run in
        # `lint-local`. If a dedicated job is removed, drop its hook
        # name from SKIP to restore CI coverage. Issue #1034.
        env:
          SKIP: agnix,shellcheck,gitleaks,agent-lint,cargo-fmt,cargo-clippy,larch-lint,lint-no-raw-stderr-after-quiet-init,bash-syntax-check,check-topology-rule-paths
        run: |
          set -euo pipefail
          log="$(mktemp)"
          for attempt in 1 2 3; do
            set +e
            make lint-only 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e

            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Fq 'failed to download https://github.com/zhupanov/agent-lint/releases/download/' "$log"; then
              exit "$rc"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$rc"
            fi

            echo "agent-lint release download failed; retrying make lint-only" >&2
            sleep 10
          done

  # Local bash linters, split from `lint` into a parallel job so
  # both halves run concurrently. Runs local hooks while `lint` runs the
  # external-tool hooks (markdownlint, jsonlint, agent-lint, actionlint).
  lint-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: pip-lint-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.main-cache-keys.outputs.pip-lint }}
      - id: pre-commit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.main-cache-keys.outputs.pre-commit }}
      - name: Install lint dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "30"
        run: pip install -r .github/workflows/requirements-lint.txt
      - name: Run pre-commit linters (local)
        # Runs local bash linters. External tools (markdownlint,
        # jsonlint, actionlint) run in `lint`. Dedicated-job hooks
        # (gitleaks, agnix, shellcheck, agent-lint, and Rust
        # hooks covered by rust-gate) are skipped here.
        env:
          SKIP: agnix,shellcheck,gitleaks,markdownlint,jsonlint,agent-lint,actionlint,cargo-fmt,cargo-clippy,larch-lint,check-topology-rule-paths
        run: make lint-only
      - name: Pipe SIGPIPE safety lint
        run: bash scripts/test-pipe-sigpipe-safety.sh

  # Dedicated shellcheck job — installs the pinned shellcheck-py==0.11.0.1
  # binary directly (no pre-commit overhead), compiles the dependency-free
  # canonical manifest reader, and runs shellcheck -x in parallel via xargs.
  # The pre-commit `shellcheck` hook remains active for local `pre-commit run`
  # and the dev git-hook; CI skips it in `lint` and `lint-local` via SKIP.
  # shellcheck-py pinned to 0.11.0.1 — keep in sync with .pre-commit-config.yaml on bump.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: pip-shellcheck-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.main-cache-keys.outputs.pip-shellcheck }}
      - name: Install shellcheck
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "30"
        run: pip install shellcheck-py==0.11.0.1
      - name: Run shellcheck
        run: |
          set -euo pipefail
          max_parallel="$(nproc 2>/dev/null || echo 1)"
          residual_bash_reader="$RUNNER_TEMP/larch-residual-bash-paths"
          rustc --edition=2024 --crate-name larch_residual_bash_paths \
            "$GITHUB_WORKSPACE/crates/larch-harness-mark/src/residual_bash_main.rs" \
            -o "$residual_bash_reader"
          "$residual_bash_reader" --root "$GITHUB_WORKSPACE" \
            | xargs -0 -r -n 1 -P "$max_parallel" shellcheck -x --exclude=SC2329 --

  # Regression harness shards (the `test-*` bash scripts in Makefile). Runs
  # as a parallel matrix in parallel with the `lint` and `shellcheck` jobs so
  # a harness failure can be diagnosed and re-run without waiting on
  # pre-commit, and vice versa. Installs only the Python packages used by the
  # Bash harnesses via requirements-test-harnesses.txt (the lint job uses
  # requirements-lint.txt, which also pulls pre-commit).
  test-harnesses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.11"
      - id: pip-test-harnesses-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.main-cache-keys.outputs.pip-test-harnesses }}
      - name: Resolve interpreter site-packages
        id: site-packages
        run: printf 'path=%s\n' "$(python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_OUTPUT"
      - name: Cache installed Python packages
        id: cache-site-packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.site-packages.outputs.path }}
          key: ${{ steps.main-cache-keys.outputs.site-test-harnesses }}
      - name: Install test harness Python dependencies
        if: steps.cache-site-packages.outputs.cache-hit != 'true'
        run: pip install -r .github/workflows/requirements-test-harnesses.txt
      # Shard 1 is the only harness leg that builds larch. Restore the exact
      # trusted dependency caches, but leave the current checkout's executable
      # to Cargo so a cached workspace product can never run candidate code.
      - name: Restore Cargo inputs for Rust hook harness
        if: matrix.shard == 1
        id: cargo-inputs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
      - name: Restore Rust lint dependencies for Rust hook harness
        if: matrix.shard == 1
        id: rust-lint-deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/debug
          key: ${{ steps.main-cache-keys.outputs.rust-lint-deps }}
      - name: Run Rust hook harness (shard 1 of 2)
        if: matrix.shard == 1
        id: rust-hook-bootstrap
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          LARCH_BINARY: ""
        run: |
          set -euo pipefail
          make test-harnesses-${{ matrix.shard }}
          printf 'seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Run test harnesses (shards other than 1)
        if: matrix.shard != 1
        run: make test-harnesses-${{ matrix.shard }}
      - name: Record Rust hook harness cache timing metadata
        if: always() && matrix.shard == 1
        run: |
          {
            echo "## Rust hook harness cache timing metadata"
            echo "- cargo_inputs_cache_hit: ${{ steps.cargo-inputs-cache.outputs.cache-hit }}"
            echo "- rust_lint_deps_cache_hit: ${{ steps.rust-lint-deps-cache.outputs.cache-hit }}"
            echo "- rust_bootstrap_seconds: ${{ steps.rust-hook-bootstrap.outputs.seconds }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Aggregate gate so branch protection can require the whole test-harnesses
  # matrix via one stable check, regardless of shard count.
  # needs.<job>.result is 'success' only when every matrix leg succeeded;
  # `if: always()` ensures this job still runs (and reports failure) when a
  # shard fails, instead of being skipped (a skipped required check passes).
  test-harnesses-gate:
    name: test-harnesses-gate
    needs: [test-harnesses]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all test-harnesses shards to pass
        run: |
          result="${{ needs.test-harnesses.result }}"
          [ "$result" = success ] || { echo "::error::test-harnesses result=$result"; exit 1; }

  # Third-party agent/config linters run sequentially on one runner instead of
  # competing for separate runners.
  agent-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: pip-agent-linters-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.main-cache-keys.outputs.pip-agent-linters }}
      - name: Cache agent-lint binary
        id: cache-agent-lint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /usr/local/bin/agent-lint
          key: ${{ steps.main-cache-keys.outputs.agent-lint }}
      - name: Cache agnix binary
        id: cache-agnix
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /usr/local/bin/agnix
          key: ${{ steps.main-cache-keys.outputs.agnix }}
      - uses: ./.github/actions/agent-tools-bootstrap
      - name: Run agent-lint
        run: agent-lint --pedantic .
      - name: Run agnix
        run: agnix . --strict --target claude-code --config .agnix.toml
      - name: Install lintlang
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "30"
        run: pip install -r .github/workflows/requirements-agent-linters.txt
      - name: Verify lintlang
        run: lintlang --version
      - name: Run lintlang
        run: lintlang scan agents .claude/agents skills .claude/skills --min-severity high --fail-on fail

  # The selector runs from the trusted PR-base checkout. Candidate code may
  # describe its own diff, but it must not author the decision that decides
  # whether its Rust compilation can be skipped.
  rust-selection:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.effective-mode.outputs.mode }}
      partial_doctest_packages: ${{ steps.proposed-selection.outputs.partial_doctest_packages }}
      partial_packages: ${{ steps.proposed-selection.outputs.partial_packages }}
      proposed_mode: ${{ steps.proposed-selection.outputs.mode }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The typed selector proves ancestry and reads the candidate diff.
          # Supplying full history through the checkout action means the
          # workflow never mutates Git history itself; unavailable proof still
          # selects the existing full lane.
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check out the trusted PR-base selector
        id: selector-base
        continue-on-error: true
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .rust-ci-selector-base
          fetch-depth: 1
          persist-credentials: false
      - id: main-cache-keys
        # A base/candidate cache-key schema transition must fail closed to the
        # full Rust path instead of making the selector job terminally red.
        continue-on-error: true
        uses: ./.rust-ci-selector-base/.github/actions/main-cache-keys
        with:
          rust-policy-source-root: .rust-ci-selector-base
      - name: Restore trusted main Rust policy binary
        id: trusted-main-policy-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/trusted-main-rust-policy
          key: ${{ steps.main-cache-keys.outputs.rust-policy }}
      - name: Verify trusted main Rust policy binary
        id: trusted-main-policy-validation
        env:
          RUST_POLICY_INPUTS_SHA256: ${{ steps.main-cache-keys.outputs.rust-policy-inputs-sha256 }}
          TRUSTED_POLICY_CACHE_HIT: ${{ steps.trusted-main-policy-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/trusted-main-rust-policy"
          valid=false
          if [ "$TRUSTED_POLICY_CACHE_HIT" = true ] && [ -d "$policy_dir" ]; then
            if (
              set -euo pipefail
              test -n "$RUST_POLICY_INPUTS_SHA256"
              for policy_file in larch larch.sha256 producer-ref rust-inputs-sha256 source-sha version; do
                test -f "$policy_dir/$policy_file"
                test ! -L "$policy_dir/$policy_file"
              done
              (
                cd "$policy_dir"
                sha256sum --check --strict larch.sha256
              )
              test "$(<"$policy_dir/rust-inputs-sha256")" = "$RUST_POLICY_INPUTS_SHA256"
              test "$(<"$policy_dir/producer-ref")" = refs/heads/main
              source_sha="$(<"$policy_dir/source-sha")"
              [[ "$source_sha" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]
              test "$("$policy_dir/larch" --version)" = "$(<"$policy_dir/version")"
            ); then
              valid=true
            fi
          fi
          printf 'valid=%s\n' "$valid" >> "$GITHUB_OUTPUT"
      - name: Select Rust CI mode from the trusted base
        id: proposed-selection
        env:
          RUST_CI_EVENT_NAME: ${{ github.event_name }}
          RUST_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUST_CI_HEAD_SHA: ${{ github.sha }}
          RUST_POLICY_INPUTS_SHA256: ${{ steps.main-cache-keys.outputs.rust-policy-inputs-sha256 }}
          TRUSTED_POLICY_VALID: ${{ steps.trusted-main-policy-validation.outputs.valid }}
        run: |
          set -euo pipefail
          selector_result="$RUNNER_TEMP/rust-ci-selection.json"
          selector_root="$GITHUB_WORKSPACE/.rust-ci-selector-base"
          selector_binary="$RUNNER_TEMP/trusted-main-rust-policy/larch"
          selector_history_source=full-history-checkout
          selector_history_milliseconds=0
          selector_command_milliseconds=0
          fallback_selection() {
            fallback_reason="${1:-selector-workflow-failed}"
            # Keep this fallback readable by a trusted base that predates the
            # current selector schema.
            FALLBACK_REASON="$fallback_reason" jq -cn '{
              affected_packages: [],
              base_sha: null,
              base_source: "unavailable",
              changed_paths: [],
              dependency_policy: {
                reason: "full-mode-requires-the-existing-rust-deny-lane",
                required: true
              },
              doctest_packages: [],
              event_name: "pull_request",
              format_required: true,
              full_run_trigger: env.FALLBACK_REASON,
              head_sha: null,
              mode: "full",
              partial_commands: [],
              reverse_dependents: [],
              schema_version: 1,
              skip_proof: null,
              validation_owners: []
            }' > "$selector_result"
          }
          if [ "${{ steps.selector-base.outcome }}" != success ] || [ ! -d "$selector_root" ]; then
            selector_history_source=unavailable
            printf '%s\n' '::warning::Trusted selector base checkout was unavailable; using the full Rust CI fallback.'
            fallback_selection selector-base-checkout-unavailable
          elif [ "$TRUSTED_POLICY_VALID" != true ] || [ ! -x "$selector_binary" ]; then
            printf '%s\n' '::warning::Trusted main selector executable was unavailable or invalid; using the full Rust CI fallback.'
            fallback_selection trusted-main-policy-unavailable-or-invalid
          else
            selector_command_started_milliseconds="$(date +%s%3N)"
            if ! CLAUDE_PLUGIN_ROOT="$selector_root" LARCH_BINARY="$selector_binary" \
              "$selector_root/scripts/larch.sh" ci rust-select \
                --event-name "$RUST_CI_EVENT_NAME" \
                --base-sha "$RUST_CI_BASE_SHA" \
                --head-sha "$RUST_CI_HEAD_SHA" \
                --repo-root "$GITHUB_WORKSPACE" > "$selector_result"; then
              printf '%s\n' '::warning::Rust selector command failed; using the full Rust CI fallback.'
              fallback_selection
            fi
            selector_command_milliseconds="$(( $(date +%s%3N) - selector_command_started_milliseconds ))"
          fi
          if [ ! -f "$selector_result" ]; then
            fallback_selection selector-workflow-failed
          fi
          read_selection_outputs() {
            mode="$(jq -er '
              if .mode == "full" or .mode == "partial" or .mode == "skip" then .mode
              else error("invalid Rust CI mode") end
            ' "$selector_result")" || return 1
            partial_packages="$(jq -ce '
              def valid_packages:
                type == "array" and length > 0 and
                all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$"));
              if .mode == "partial" and (.affected_packages | valid_packages)
              then .affected_packages
              elif .mode == "full" or .mode == "skip" then []
              else error("invalid partial package selection") end
            ' "$selector_result")" || return 1
            partial_doctest_packages="$(jq -ce '
              def valid_packages:
                type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$"));
              if .mode == "partial" and ((.doctest_packages // []) | valid_packages)
              then (.doctest_packages // [])
              elif .mode == "full" or .mode == "skip" then []
              else error("invalid doctest package selection") end
            ' "$selector_result")" || return 1
            jq -en \
              --argjson selected "$partial_packages" \
              --argjson doctests "$partial_doctest_packages" \
              'all($doctests[]; . as $doctest | ($selected | index($doctest) != null))' >/dev/null || return 1
          }
          if ! read_selection_outputs; then
            printf '%s\n' '::warning::Rust selector result was malformed; using the full Rust CI fallback.'
            fallback_selection
            read_selection_outputs
          fi
          if [ "$TRUSTED_POLICY_VALID" = true ] && [ -x "$selector_binary" ] && ! CLAUDE_PLUGIN_ROOT="$selector_root" LARCH_BINARY="$selector_binary" \
            "$selector_root/scripts/larch.sh" ci rust-select-summary \
              --result-file "$selector_result" >> "$GITHUB_STEP_SUMMARY"; then
            printf '%s\n' '::warning::Rust selector summary failed; the full fallback remains available.'
          elif [ "$TRUSTED_POLICY_VALID" != true ] || [ ! -x "$selector_binary" ]; then
            printf '%s\n' '## Rust CI selection'
            printf '%s\n' "Proposed mode: \`full\` because the trusted selector executable was unavailable."
          fi
          if [ -z "$RUST_POLICY_INPUTS_SHA256" ]; then
            printf '%s\n' '::warning::Trusted base cache-key action did not expose a Rust-input digest; the full fallback remains required.'
          fi
          {
            printf 'RUST_SELECTION_HISTORY_MILLISECONDS=%s\n' "$selector_history_milliseconds"
            printf 'RUST_SELECTION_HISTORY_SOURCE=%s\n' "$selector_history_source"
            printf 'RUST_SELECTION_COMMAND_MILLISECONDS=%s\n' "$selector_command_milliseconds"
          } >> "$GITHUB_ENV"
          {
            printf '## Rust CI selection setup timings\n\n'
            printf '| Phase | Milliseconds | Detail |\n'
            printf '| --- | ---: | --- |\n'
            printf '| Candidate history | %s | %s |\n' "$selector_history_milliseconds" "$selector_history_source"
            printf '| Selector command | %s | trusted-base wrapper with trusted-main CLI |\n' "$selector_command_milliseconds"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'mode=%s\n' "$mode"
            printf 'partial_packages=%s\n' "$partial_packages"
            printf 'partial_doctest_packages=%s\n' "$partial_doctest_packages"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve effective Rust CI mode
        id: effective-mode
        env:
          PROPOSED_MODE: ${{ steps.proposed-selection.outputs.mode }}
          RUST_CI_FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-rust-ci') }}
          RUST_CI_PARTIAL_ENFORCEMENT: ${{ env.RUST_CI_PARTIAL_ENFORCEMENT }}
          RUST_CI_SKIP_ENFORCEMENT: ${{ env.RUST_CI_SKIP_ENFORCEMENT }}
          TRUSTED_POLICY_VALID: ${{ steps.trusted-main-policy-validation.outputs.valid }}
        run: |
          set -euo pipefail
          mode="$PROPOSED_MODE"
          effective_reason="selector-proposed-$mode"
          rollout_state=not-applicable
          observation_only=false
          if [ "$RUST_CI_FORCE_FULL" = true ]; then
            mode=full
            effective_reason=forced-by-full-rust-ci-label
            rollout_state=forced-full
            printf '%s\n' 'The full-rust-ci pull-request label forced the full Rust CI path.' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PROPOSED_MODE" = partial ] && [ "$RUST_CI_PARTIAL_ENFORCEMENT" != true ]; then
            mode=full
            effective_reason=partial-observation-window-open
            rollout_state=observation
            observation_only=true
            printf '%s\n' 'Partial selection is under observation; the full Rust CI backstop remains required.' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PROPOSED_MODE" = skip ] && [ "$RUST_CI_SKIP_ENFORCEMENT" != true ]; then
            mode=full
            effective_reason=skip-observation-window-open
            rollout_state=observation
            observation_only=true
            printf '%s\n' 'Skip selection is under observation; the full Rust CI backstop remains required.' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = skip ] && [ "$TRUSTED_POLICY_VALID" != true ]; then
            mode=full
            effective_reason=trusted-main-policy-unavailable-or-invalid
            rollout_state=blocked
            printf '%s\n' 'Trusted main policy binary was unavailable or invalid; falling back to full Rust CI.' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = partial ] || [ "$mode" = skip ]; then
            rollout_state=enforced
          fi
          selector_result="$RUNNER_TEMP/rust-ci-selection.json"
          selector_result_next="$RUNNER_TEMP/rust-ci-selection-effective.json"
          jq \
            --arg effective_mode "$mode" \
            --arg effective_reason "$effective_reason" \
            --arg rollout_state "$rollout_state" \
            --argjson observation_only "$observation_only" '
            .proposed_mode = .mode |
            .effective_mode = $effective_mode |
            .effective_mode_reason = $effective_reason |
            .rollout_state = $rollout_state |
            .observation_only = $observation_only
          ' "$selector_result" > "$selector_result_next"
          mv "$selector_result_next" "$selector_result"
          printf 'Effective execution mode: %s\n' "$mode" >> "$GITHUB_STEP_SUMMARY"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Upload Rust CI selection result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-ci-selection
          path: ${{ runner.temp }}/rust-ci-selection.json
          if-no-files-found: error
      - name: Upload verified trusted main policy binary
        if: steps.effective-mode.outputs.mode == 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-main-rust-policy
          path: ${{ runner.temp }}/trusted-main-rust-policy
          if-no-files-found: error

  # Rust format and Clippy lane. Repository policy runs in the coverage
  # execution lane, while cargo-deny remains independent.
  rust-lint:
    needs: [rust-selection]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PARTIAL_PACKAGES_JSON: ${{ needs.rust-selection.outputs.partial_packages || '[]' }}
      RUST_CI_MODE: ${{ github.event_name == 'pull_request' && needs.rust-selection.result == 'success' && needs.rust-selection.outputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - name: Install pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component list --installed
      # Cargo inputs are restored by every Rust lane. An exact merge-group miss
      # may stage a candidate, but the separate trusted main publisher is the
      # only production cache writer.
      - name: Restore Cargo inputs
        if: env.RUST_CI_MODE != 'skip'
        id: cargo-inputs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
      - name: Restore Rust lint dependencies
        if: env.RUST_CI_MODE != 'skip'
        id: rust-lint-deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/debug
          key: ${{ steps.main-cache-keys.outputs.rust-lint-deps }}
      - name: Check Rust formatting
        if: env.RUST_CI_MODE != 'skip'
        run: make rust-fmt
      - name: Run Clippy with warnings denied
        if: env.RUST_CI_MODE == 'full'
        run: make rust-clippy
      - name: Run selected Clippy with warnings denied
        if: env.RUST_CI_MODE == 'partial'
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            case "$package" in
              ''|*[!A-Za-z0-9_-]*|[-_]* ) printf 'invalid selected package: %s\n' "$package" >&2; exit 1 ;;
              [0-9]* ) printf 'invalid selected package: %s\n' "$package" >&2; exit 1 ;;
            esac
            package_args+=(--package "$package")
          done < <(printf '%s' "$PARTIAL_PACKAGES_JSON" | jq -er '
            if type == "array" and length > 0 and all(.[]; type == "string") then .[]
            else error("invalid selected packages") end
          ')
          cargo clippy "${package_args[@]}" --all-targets --all-features --locked -- -D warnings
      - name: Record Rust lint skip ownership
        if: env.RUST_CI_MODE == 'skip'
        run: |
          set -euo pipefail
          printf '%s\n' 'Rust formatting and Clippy are not needed: the trusted selection proved a supplementary-only diff.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Prune workspace artifacts from Rust lint cache
        if: env.RUST_CI_MODE == 'full'
        run: cargo clean --workspace
      - name: Build larch for main-cache candidate staging
        if: >-
          success() && github.event_name == 'merge_group' &&
          (steps.cargo-inputs-cache.outputs.cache-hit != 'true' ||
          steps.rust-lint-deps-cache.outputs.cache-hit != 'true')
        run: |
          set -euo pipefail
          cargo build --quiet --locked --package larch-cli --bin larch \
            --target-dir "$RUNNER_TEMP/larch-main-cache-bin"
      - name: Stage Cargo inputs cache candidate
        if: success() && github.event_name == 'merge_group' && steps.cargo-inputs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Cargo creates this directory only after resolving a git dependency.
          # Stage it so the cache contract includes it alongside the registry;
          # the trusted publisher reconstitutes it when artifact transport omits
          # the empty directory.
          mkdir -p "$HOME/.cargo/git"
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$RUNNER_TEMP/larch-main-cache-bin/debug/larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" ci stage-main-cache-candidate \
            --artifact-name main-cache-cargo-inputs-candidate \
            --cache-class cargo-inputs \
            --cache-key '${{ steps.main-cache-keys.outputs.cargo-inputs }}' \
            --candidate-dir "$RUNNER_TEMP/main-cache-cargo-inputs-candidate" \
            --maximum-bytes 0 \
            --producer-event "$GITHUB_EVENT_NAME" \
            --producer-job rust-lint \
            --producer-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --source "registry=$HOME/.cargo/registry" \
            --source "git=$HOME/.cargo/git" \
            --tool-version "cargo=$(cargo --version)" \
            --tool-version "rustc=$(rustc --version)"
      - name: Upload Cargo inputs cache candidate
        if: success() && github.event_name == 'merge_group' && steps.cargo-inputs-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-cache-cargo-inputs-candidate
          path: ${{ runner.temp }}/main-cache-cargo-inputs-candidate
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
      - name: Stage Rust lint dependency cache candidate
        if: success() && github.event_name == 'merge_group' && steps.rust-lint-deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$RUNNER_TEMP/larch-main-cache-bin/debug/larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" ci stage-main-cache-candidate \
            --artifact-name main-cache-rust-lint-deps-candidate \
            --cache-class rust-lint-deps \
            --cache-key '${{ steps.main-cache-keys.outputs.rust-lint-deps }}' \
            --candidate-dir "$RUNNER_TEMP/main-cache-rust-lint-deps-candidate" \
            --maximum-bytes 0 \
            --producer-event "$GITHUB_EVENT_NAME" \
            --producer-job rust-lint \
            --producer-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --source "debug=$GITHUB_WORKSPACE/target/debug" \
            --tool-version "cargo=$(cargo --version)" \
            --tool-version "rustc=$(rustc --version)"
      - name: Upload Rust lint dependency cache candidate
        if: success() && github.event_name == 'merge_group' && steps.rust-lint-deps-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-cache-rust-lint-deps-candidate
          path: ${{ runner.temp }}/main-cache-rust-lint-deps-candidate
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false

  # Dependency policy is independent of compilation lint, so it runs in
  # parallel instead of extending the rust-lint critical path.
  rust-deny:
    needs: [rust-selection]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_CI_MODE: ${{ github.event_name == 'pull_request' && needs.rust-selection.result == 'success' && needs.rust-selection.outputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      # cargo-deny-action v2.1.1. Pin the full SHA so dependency policy cannot
      # change without a reviewed workflow edit.
      - name: Check Rust dependency policy
        if: env.RUST_CI_MODE == 'full'
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902
        with:
          arguments: --locked --all-features
      - name: Record dependency policy skip ownership
        if: env.RUST_CI_MODE != 'full'
        run: |
          set -euo pipefail
          printf '%s\n' 'Dependency policy is unchanged by the selected non-full diff.' >> "$GITHUB_STEP_SUMMARY"

  # Prepare the exact LCOV runtime while the full producers are still running.
  # The aggregate verifies and extracts this same-run artifact instead of
  # installing LCOV on the post-shard critical path.
  rust-full-lcov-tool:
    name: rust-full LCOV tool
    needs: [rust-selection]
    if: always() && (github.event_name != 'pull_request' || needs.rust-selection.result != 'success' || needs.rust-selection.outputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LCOV_PACKAGE_VERSION: 2.0-4ubuntu2
    steps:
      - name: Package pinned LCOV runtime ahead of aggregation
        run: |
          set -euo pipefail
          package_before="$RUNNER_TEMP/lcov-packages-before.txt"
          package_after="$RUNNER_TEMP/lcov-packages-after.txt"
          runtime_packages="$RUNNER_TEMP/lcov-runtime-packages.txt"
          runtime_paths="$RUNNER_TEMP/lcov-runtime-paths.txt"
          artifact_root="$RUNNER_TEMP/rust-coverage-lcov-tools"
          runtime_archive="$artifact_root/lcov-runtime.tar.gz"
          runtime_check="$RUNNER_TEMP/lcov-runtime-check"

          dpkg-query --show --showformat='${binary:Package}\t${Version}\t${Status}\n' \
            | awk -F '\t' '$3 == "install ok installed" { print $1 "\t" $2 }' \
            | LC_ALL=C sort -u > "$package_before"
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install --yes --no-install-recommends "lcov=$LCOV_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' lcov)" = "$LCOV_PACKAGE_VERSION"
          dpkg-query --show --showformat='${binary:Package}\t${Version}\t${Status}\n' \
            | awk -F '\t' '$3 == "install ok installed" { print $1 "\t" $2 }' \
            | LC_ALL=C sort -u > "$package_after"
          {
            printf '%s\n' lcov
            LC_ALL=C comm -13 "$package_before" "$package_after" | cut -f 1
          } | LC_ALL=C sort -u > "$runtime_packages"

          package_count="$(wc -l < "$runtime_packages" | tr -d ' ')"
          test "$package_count" -ge 1
          test "$package_count" -le 64
          while IFS= read -r package; do
            case "$package" in
              ''|*[!A-Za-z0-9+_.:-]*)
                printf '::error::invalid LCOV runtime package name=%s\n' "$package"
                exit 1
                ;;
            esac
            dpkg-query --listfiles "$package"
          done < "$runtime_packages" \
            | sed -e 's#^/##' -e '/^\.$/d' \
            | LC_ALL=C sort -u > "$runtime_paths"
          test -s "$runtime_paths"
          while IFS= read -r runtime_path; do
            case "$runtime_path" in
              ''|/*|../*|*/../*|*/..)
                printf '::error::unsafe LCOV runtime path=%s\n' "$runtime_path"
                exit 1
                ;;
            esac
          done < "$runtime_paths"

          mkdir -p "$artifact_root" "$runtime_check"
          tar --create --gzip --file "$runtime_archive" --directory / \
            --no-recursion --verbatim-files-from --files-from "$runtime_paths"
          archive_bytes="$(stat --format='%s' "$runtime_archive")"
          test "$archive_bytes" -gt 0
          test "$archive_bytes" -le 67108864
          printf 'LCOV_PACKAGE_VERSION=%s\n' "$LCOV_PACKAGE_VERSION" \
            > "$artifact_root/lcov-runtime.env"
          cp "$runtime_packages" "$artifact_root/packages.txt"
          (
            cd "$artifact_root"
            sha256sum lcov-runtime.tar.gz lcov-runtime.env packages.txt > SHA256SUMS
          )

          tar --extract --gzip --file "$runtime_archive" --directory "$runtime_check"
          runtime_lcov="$(realpath "$runtime_check/usr/bin/lcov")"
          case "$runtime_lcov" in
            "$runtime_check"/*) ;;
            *) printf '::error::LCOV runtime executable escapes its root\n'; exit 1 ;;
          esac
          test -f "$runtime_lcov"
          test -x "$runtime_lcov"
          perl_libs=("$runtime_check/usr/lib/lcov" "$runtime_check/usr/share/perl5")
          while IFS= read -r -d '' perl_lib; do
            perl_libs+=("$perl_lib")
          done < <(find "$runtime_check/usr/lib" -type d -path '*/perl5/*' -prune -print0)
          perl5lib="$(IFS=:; printf '%s' "${perl_libs[*]}")"
          runtime_version="$(LC_ALL=C PERL5LIB="$perl5lib" "$runtime_lcov" --version)"
          test "$runtime_version" = 'lcov: LCOV version 2.0-1'
      - name: Upload pinned LCOV runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov-tools
          path: ${{ runner.temp }}/rust-coverage-lcov-tools
          if-no-files-found: error
          overwrite: false

  # The full path remains the merge-group/manual backstop. Pull requests enter
  # it whenever selection is full or selection infrastructure cannot prove a
  # narrower path. Each shard rebuilds the instrumented workspace and owns one
  # hash partition. The first shard also owns doctests, plugin validation, the
  # bootstrap integration checks and trusted-main policy-cache candidate staging. The
  # repository-policy scan runs in its own parallel coverage job below.
  rust-full-shards:
    name: rust-full shard ${{ matrix.shard }}
    needs: [rust-selection]
    if: always() && (github.event_name != 'pull_request' || needs.rust-selection.result != 'success' || needs.rust-selection.outputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_NEXTEST_VERSION: "0.9.137"
      CARGO_NEXTEST_ARCHIVE_SHA256: "38fd6275e111b200bbbed1bd2ae91cbb0d7edd28504879875cff2b3d96f3f311"
      CARGO_NEXTEST_BINARY_SHA256: "9c05bd3c7c5da1286b193873f12b37db386485fa483d8fa0554e68a53d9df550"
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_ARCHIVE_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
      CARGO_LLVM_COV_BINARY_SHA256: "8bff2fb8e14655f92d50afe7873945c6e46981505f3f3469683bf11da1ff8042"
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_IGNORE_REGEX: '(^|/)(crates/larch-test-support|tests|fixtures)(/|$)|/build\.rs$'
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      NEXTEST_TEST_THREADS: "16"
      COVERAGE_PROFILE_BENCHMARK: "false"
      COVERAGE_PROFILE_SAMPLE: "1"
      RUST_COVERAGE_PHASE_MODE: sequential
      RUST_COVERAGE_EXECUTION_ROLE: test-shard
      COVERAGE_SHARD_INDEX: ${{ matrix.shard }}
      COVERAGE_SHARD_COUNT: "4"
      COVERAGE_LCOV_ARTIFACT_SUFFIX: ${{ format('-shard-{0}', matrix.shard) }}
      COVERAGE_TIMING_ARTIFACT_SUFFIX: ${{ format('-opt0-sample1-shard-{0}', matrix.shard) }}
      COVERAGE_RUN_BOOTSTRAP_INTEGRATION: "true"
      # Three comparable warm-cache main samples beat the cache-off control
      # end to end. The expanded dependency-only inventory is 1,369,854,810
      # bytes, so this reviewed decimal bound leaves 30,145,190 bytes of
      # headroom. The target-cache benchmark dispatch keeps this full shard
      # path cache-off as its paired control; every other full lane restores
      # this exact cache.
      COVERAGE_TARGET_CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_target_cache_benchmark && 'false' || 'true' }}
      COVERAGE_TARGET_CACHE_SCHEMA: "v2"
      COVERAGE_TARGET_CACHE_KEY_PREFIX: "coverage-target-deps"
      COVERAGE_TARGET_CACHE_PUBLICATION: "main-cache-candidate"
      COVERAGE_TARGET_CACHE_MAX_BYTES: "1400000000"
      RUST_COVERAGE_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
      RUST_COVERAGE_FEATURE_MODE: "all-features"
      RUST_COVERAGE_LINKER: "runner-default"
      RUST_POLICY_CACHE_SCHEMA: "v1"
    steps:
      - name: Start Rust coverage job timing
        run: |
          set -euo pipefail
          printf 'COVERAGE_JOB_TIMING_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      # `checks run-relevant` spawns `pre-commit`; install it so the coverage
      # run can exercise that path (#8616).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pre-commit for relevant-checks coverage
        run: python -m pip install pre-commit
      - uses: ./.github/actions/rust-coverage
        env:
          CARGO_INPUTS_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
          CARGO_LLVM_COV_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-llvm-cov }}
          CARGO_NEXTEST_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-nextest }}
          COVERAGE_TARGET_CACHE_KEY: ${{ steps.main-cache-keys.outputs.coverage-target }}
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}
      - name: Look up trusted main Rust policy cache key
        id: trusted-main-policy-cache
        if: success() && matrix.shard == 1 && github.event_name == 'merge_group'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/trusted-main-rust-policy
          key: ${{ steps.main-cache-keys.outputs.rust-policy }}
      # The coverage action has already prepared the policy bundle and
      # pruned workspace products. A merge-group run stages a candidate only
      # on an exact main-key miss; the trusted publication workflow is the
      # sole cache writer.
      - name: Stage and verify Rust policy cache candidate
        if: success() && matrix.shard == 1 && github.event_name == 'merge_group' && steps.trusted-main-policy-cache.outputs.cache-hit != 'true'
        env:
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/main-cache-rust-policy"
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" \
            LARCH_BINARY="$RUNNER_TEMP/larch-linux-test-binary/larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" ci stage-rust-policy-candidate \
            --artifact-dir "$RUNNER_TEMP/larch-linux-test-binary" \
            --policy-dir "$RUNNER_TEMP/main-cache-rust-policy/policy" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --rust-inputs-sha256 "$RUST_POLICY_INPUTS_SHA256"
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$RUNNER_TEMP/larch-linux-test-binary/larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" ci stage-main-cache-candidate \
            --artifact-name main-cache-rust-policy-candidate \
            --cache-class rust-policy \
            --cache-key '${{ steps.main-cache-keys.outputs.rust-policy }}' \
            --candidate-dir "$RUNNER_TEMP/main-cache-rust-policy-candidate" \
            --maximum-bytes 0 \
            --producer-event "$GITHUB_EVENT_NAME" \
            --producer-job 'rust-full shard 1' \
            --producer-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --source "policy=$RUNNER_TEMP/main-cache-rust-policy/policy" \
            --tool-version "cargo=$(cargo --version)" \
            --tool-version "rustc=$(rustc --version)"
      - name: Upload Rust policy cache candidate
        if: success() && matrix.shard == 1 && github.event_name == 'merge_group' && steps.trusted-main-policy-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-cache-rust-policy-candidate
          path: ${{ runner.temp }}/main-cache-rust-policy-candidate
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false

  # Keep repository policy off the test-shard critical path. This job builds
  # only the instrumented larch binary, runs the single full policy scan, and
  # contributes its profile to the stable merged line gate.
  rust-full-policy:
    name: rust-full policy
    needs: [rust-selection]
    if: always() && (github.event_name != 'pull_request' || needs.rust-selection.result != 'success' || needs.rust-selection.outputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_ARCHIVE_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
      CARGO_LLVM_COV_BINARY_SHA256: "8bff2fb8e14655f92d50afe7873945c6e46981505f3f3469683bf11da1ff8042"
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_IGNORE_REGEX: '(^|/)(crates/larch-test-support|tests|fixtures)(/|$)|/build\.rs$'
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      NEXTEST_TEST_THREADS: "16"
      COVERAGE_PROFILE_BENCHMARK: "false"
      COVERAGE_PROFILE_SAMPLE: "1"
      RUST_COVERAGE_PHASE_MODE: sequential
      RUST_COVERAGE_EXECUTION_ROLE: policy
      COVERAGE_LCOV_ARTIFACT_SUFFIX: "-policy"
      COVERAGE_TIMING_ARTIFACT_SUFFIX: "-opt0-sample1-policy"
      COVERAGE_RUN_BOOTSTRAP_INTEGRATION: "false"
      COVERAGE_TARGET_CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_target_cache_benchmark && 'false' || 'true' }}
      COVERAGE_TARGET_CACHE_SCHEMA: "v2"
      COVERAGE_TARGET_CACHE_KEY_PREFIX: "coverage-target-deps"
      COVERAGE_TARGET_CACHE_PUBLICATION: "main-cache-candidate"
      COVERAGE_TARGET_CACHE_MAX_BYTES: "1400000000"
      RUST_COVERAGE_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
      RUST_COVERAGE_FEATURE_MODE: "all-features"
      RUST_COVERAGE_LINKER: "runner-default"
    steps:
      - name: Start Rust coverage job timing
        run: |
          set -euo pipefail
          printf 'COVERAGE_JOB_TIMING_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - uses: ./.github/actions/rust-coverage
        env:
          CARGO_INPUTS_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
          CARGO_LLVM_COV_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-llvm-cov }}
          CARGO_NEXTEST_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-nextest }}
          COVERAGE_TARGET_CACHE_KEY: ${{ steps.main-cache-keys.outputs.coverage-target }}
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}

  # The partial path has a strict package closure but still builds the CLI from
  # the candidate, validates repository policy and plugin projection, and runs
  # the same bootstrap integration checks. It deliberately omits only
  # the full-workspace coverage threshold.
  rust-partial:
    name: rust-partial
    needs: [rust-selection]
    if: needs.rust-selection.result == 'success' && needs.rust-selection.outputs.mode == 'partial'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      PARTIAL_DOCTEST_PACKAGES_JSON: ${{ needs.rust-selection.outputs.partial_doctest_packages }}
      PARTIAL_PACKAGES_JSON: ${{ needs.rust-selection.outputs.partial_packages }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - name: Install pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Restore Cargo inputs
        id: cargo-inputs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
      - name: Run selected Rust tests and build the policy executable
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            case "$package" in
              ''|*[!A-Za-z0-9_-]*|[-_]*|[0-9]* ) printf 'invalid selected package: %s\n' "$package" >&2; exit 1 ;;
            esac
            package_args+=(--package "$package")
          done < <(printf '%s' "$PARTIAL_PACKAGES_JSON" | jq -er '
            if type == "array" and length > 0 and all(.[]; type == "string") then .[]
            else error("invalid selected packages") end
          ')
          printf '%s' "$PARTIAL_PACKAGES_JSON" | jq -er 'index("larch-cli") != null' >/dev/null
          cargo test "${package_args[@]}" --all-targets --all-features --locked

          doctest_args=()
          while IFS= read -r package; do
            case "$package" in
              ''|*[!A-Za-z0-9_-]*|[-_]*|[0-9]* ) printf 'invalid doctest package: %s\n' "$package" >&2; exit 1 ;;
            esac
            doctest_args+=(--package "$package")
          done < <(printf '%s' "$PARTIAL_DOCTEST_PACKAGES_JSON" | jq -er '
            if type == "array" and all(.[]; type == "string") then .[]
            else error("invalid doctest packages") end
          ')
          if [ "${#doctest_args[@]}" -gt 0 ]; then
            cargo test --doc "${doctest_args[@]}" --all-features --locked
          fi
          cargo build --package larch-cli --bin larch --all-features --locked
          test -x "$GITHUB_WORKSPACE/target/debug/larch"
      - name: Run repository and plugin validation with the partial executable
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/larch-partial-policy-%p.profraw
        run: |
          set -euo pipefail
          policy_larch="$GITHUB_WORKSPACE/target/debug/larch"
          test -x "$policy_larch"
          "$policy_larch" --version
          "$policy_larch" lint all --timing-file "$RUNNER_TEMP/rust-partial-policy-rules.tsv"
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime --check
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime --check --check-worktree
      - name: Run bootstrap integration with the partial executable
        env:
          LARCH_TEST_RUST_BINARY: ${{ github.workspace }}/target/debug/larch
          RUST_CI_MODE: partial
        run: |
          set -euo pipefail
          read -r LARCH_TEST_RUST_BINARY_SHA256 _ < <(sha256sum "$LARCH_TEST_RUST_BINARY")
          export LARCH_TEST_RUST_BINARY_SHA256
          bash scripts/test-rust-integration-consumer.sh
          LARCH_BINARY="$LARCH_TEST_RUST_BINARY" make test-findings-classification
      - name: Summarize partial Rust selection
        if: always()
        run: |
          set -euo pipefail
          printf '## Partial Rust CI\n\nNo full-workspace coverage threshold ran. Selected package tests, applicable doctests, repository policy, plugin projection validation, and bootstrap integration remain required.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  # A skip path never executes a PR-provided Rust binary. The selection job
  # restores and validates an exact trusted-main cache entry first; this job
  # validates that artifact again before policy, projection, and integration use.
  rust-skip:
    name: rust-skip
    needs: [rust-selection]
    if: needs.rust-selection.result == 'success' && needs.rust-selection.outputs.mode == 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - name: Download verified trusted main policy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-main-rust-policy
          path: ${{ runner.temp }}/trusted-main-rust-policy
      - name: Verify trusted main policy artifact
        env:
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}
        run: |
          set -euo pipefail
          test -n "$RUST_POLICY_INPUTS_SHA256"
          policy_dir="$RUNNER_TEMP/trusted-main-rust-policy"
          for policy_file in larch larch.sha256 producer-ref rust-inputs-sha256 source-sha version; do
            test -f "$policy_dir/$policy_file"
            test ! -L "$policy_dir/$policy_file"
          done
          (
            cd "$policy_dir"
            sha256sum --check --strict larch.sha256
          )
          # download-artifact materializes regular files without preserving the
          # executable mode, so restore it only after the content check.
          chmod 755 "$policy_dir/larch"
          test -x "$policy_dir/larch"
          test "$(<"$policy_dir/rust-inputs-sha256")" = "$RUST_POLICY_INPUTS_SHA256"
          test "$(<"$policy_dir/producer-ref")" = refs/heads/main
          source_sha="$(<"$policy_dir/source-sha")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]
          test "$("$policy_dir/larch" --version)" = "$(<"$policy_dir/version")"
      - name: Run repository and plugin validation with the trusted main executable
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/larch-trusted-main-policy-%p.profraw
        run: |
          set -euo pipefail
          policy_larch="$RUNNER_TEMP/trusted-main-rust-policy/larch"
          "$policy_larch" lint all --timing-file "$RUNNER_TEMP/rust-skip-policy-rules.tsv"
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime --check
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$policy_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" release plugin-runtime --check --check-worktree
      - name: Run bootstrap integration with the trusted main executable
        env:
          LARCH_TEST_RUST_BINARY: ${{ runner.temp }}/trusted-main-rust-policy/larch
          RUST_CI_MODE: skip
        run: |
          set -euo pipefail
          read -r LARCH_TEST_RUST_BINARY_SHA256 _ < <(sha256sum "$LARCH_TEST_RUST_BINARY")
          export LARCH_TEST_RUST_BINARY_SHA256
          bash scripts/test-rust-integration-consumer.sh
          LARCH_BINARY="$LARCH_TEST_RUST_BINARY" make test-findings-classification
      - name: Summarize skipped Rust compilation
        if: always()
        run: |
          set -euo pipefail
          printf '## Rust compilation skipped\n\nTrusted-main repository policy, plugin projection validation, and bootstrap integration completed against a matching Rust-input identity.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  # Publish the protected rust-coverage status directly from the selected
  # producer path. Full mode also merges every same-run LCOV trace and applies
  # the 88% line gate once to the complete workspace result.
  rust-coverage:
    name: rust-coverage
    needs: [rust-selection, rust-full-lcov-tool, rust-full-shards, rust-full-policy, rust-partial, rust-skip]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LCOV_PACKAGE_VERSION: 2.0-4ubuntu2
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_SHARD_COUNT: "4"
    outputs:
      mode: ${{ steps.verify-mode.outputs.mode }}
    steps:
      - name: Require the selected Rust execution path to pass
        id: verify-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_POLICY_RESULT: ${{ needs.rust-full-policy.result }}
          FULL_SHARDS_RESULT: ${{ needs.rust-full-shards.result }}
          FULL_TOOL_RESULT: ${{ needs.rust-full-lcov-tool.result }}
          PARTIAL_RESULT: ${{ needs.rust-partial.result }}
          SELECTION_MODE: ${{ needs.rust-selection.outputs.mode }}
          SELECTION_RESULT: ${{ needs.rust-selection.result }}
          SKIP_RESULT: ${{ needs.rust-skip.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && [ "$SELECTION_RESULT" = success ]; then
            mode="$SELECTION_MODE"
          else
            mode=full
            printf '::warning::rust-selection result=%s; requiring the full Rust path.\n' "$SELECTION_RESULT"
          fi
          case "$mode" in
            full)
              test "$FULL_SHARDS_RESULT" = success || { printf '::error::rust-full-shards result=%s\n' "$FULL_SHARDS_RESULT"; exit 1; }
              test "$FULL_POLICY_RESULT" = success || { printf '::error::rust-full-policy result=%s\n' "$FULL_POLICY_RESULT"; exit 1; }
              test "$FULL_TOOL_RESULT" = success || { printf '::error::rust-full-lcov-tool result=%s\n' "$FULL_TOOL_RESULT"; exit 1; }
              test "$PARTIAL_RESULT" = skipped || { printf '::error::rust-partial result=%s\n' "$PARTIAL_RESULT"; exit 1; }
              test "$SKIP_RESULT" = skipped || { printf '::error::rust-skip result=%s\n' "$SKIP_RESULT"; exit 1; }
              ;;
            partial)
              test "$PARTIAL_RESULT" = success || { printf '::error::rust-partial result=%s\n' "$PARTIAL_RESULT"; exit 1; }
              test "$FULL_SHARDS_RESULT" = skipped || { printf '::error::rust-full-shards result=%s\n' "$FULL_SHARDS_RESULT"; exit 1; }
              test "$FULL_POLICY_RESULT" = skipped || { printf '::error::rust-full-policy result=%s\n' "$FULL_POLICY_RESULT"; exit 1; }
              test "$FULL_TOOL_RESULT" = skipped || { printf '::error::rust-full-lcov-tool result=%s\n' "$FULL_TOOL_RESULT"; exit 1; }
              test "$SKIP_RESULT" = skipped || { printf '::error::rust-skip result=%s\n' "$SKIP_RESULT"; exit 1; }
              ;;
            skip)
              test "$SKIP_RESULT" = success || { printf '::error::rust-skip result=%s\n' "$SKIP_RESULT"; exit 1; }
              test "$FULL_SHARDS_RESULT" = skipped || { printf '::error::rust-full-shards result=%s\n' "$FULL_SHARDS_RESULT"; exit 1; }
              test "$FULL_POLICY_RESULT" = skipped || { printf '::error::rust-full-policy result=%s\n' "$FULL_POLICY_RESULT"; exit 1; }
              test "$FULL_TOOL_RESULT" = skipped || { printf '::error::rust-full-lcov-tool result=%s\n' "$FULL_TOOL_RESULT"; exit 1; }
              test "$PARTIAL_RESULT" = skipped || { printf '::error::rust-partial result=%s\n' "$PARTIAL_RESULT"; exit 1; }
              ;;
            *) printf '::error::invalid Rust CI mode=%s\n' "$mode"; exit 1 ;;
          esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Download Rust coverage inputs
        if: steps.verify-mode.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-lcov-*
          path: ${{ runner.temp }}/rust-coverage-shards
      - name: Prepare pinned LCOV merger
        if: steps.verify-mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/rust-coverage-shards/rust-coverage-lcov-tools"
          runtime_archive="$tool_root/lcov-runtime.tar.gz"
          runtime_root="$RUNNER_TEMP/lcov-runtime"
          archive_entries="$RUNNER_TEMP/lcov-runtime-entries.txt"
          for tool_file in SHA256SUMS lcov-runtime.env lcov-runtime.tar.gz packages.txt; do
            tool_path="$tool_root/$tool_file"
            test -f "$tool_path"
            test ! -L "$tool_path"
          done
          test "$(find "$tool_root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 4
          test "$(< "$tool_root/lcov-runtime.env")" = "LCOV_PACKAGE_VERSION=$LCOV_PACKAGE_VERSION"
          grep -Fx lcov "$tool_root/packages.txt" >/dev/null
          (
            cd "$tool_root"
            sha256sum --check --strict SHA256SUMS
          )
          archive_bytes="$(stat --format='%s' "$runtime_archive")"
          test "$archive_bytes" -gt 0
          test "$archive_bytes" -le 67108864
          tar --list --gzip --file "$runtime_archive" > "$archive_entries"
          test -s "$archive_entries"
          archive_entry_count="$(wc -l < "$archive_entries" | tr -d ' ')"
          test "$archive_entry_count" -le 16384
          while IFS= read -r archive_entry; do
            case "$archive_entry" in
              ''|/*|../*|*/../*|*/..)
                printf '::error::unsafe LCOV runtime archive entry=%s\n' "$archive_entry"
                exit 1
                ;;
            esac
          done < "$archive_entries"
          mkdir -p "$runtime_root"
          tar --extract --gzip --file "$runtime_archive" --directory "$runtime_root"
          runtime_lcov="$(realpath "$runtime_root/usr/bin/lcov")"
          case "$runtime_lcov" in
            "$runtime_root"/*) ;;
            *) printf '::error::LCOV runtime executable escapes its root\n'; exit 1 ;;
          esac
          test -f "$runtime_lcov"
          test -x "$runtime_lcov"
          perl_libs=("$runtime_root/usr/lib/lcov" "$runtime_root/usr/share/perl5")
          while IFS= read -r -d '' perl_lib; do
            perl_libs+=("$perl_lib")
          done < <(find "$runtime_root/usr/lib" -type d -path '*/perl5/*' -prune -print0)
          perl5lib="$(IFS=:; printf '%s' "${perl_libs[*]}")"
          runtime_version="$(LC_ALL=C PERL5LIB="$perl5lib" "$runtime_lcov" --version)"
          test "$runtime_version" = 'lcov: LCOV version 2.0-1'
          printf 'LCOV_RUNTIME_BIN=%s\nPERL5LIB=%s\n' "$runtime_lcov" "$perl5lib" \
            >> "$GITHUB_ENV"
      - name: Merge Rust coverage and enforce the line gate
        if: steps.verify-mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          shard_root="$RUNNER_TEMP/rust-coverage-shards"
          merged_root="$RUNNER_TEMP/rust-coverage-merged"
          merged_report="$merged_root/lcov.info"
          expected_report_count="$((RUST_COVERAGE_SHARD_COUNT + 1))"
          mkdir -p "$merged_root"
          mapfile -d '' shard_reports < <(
            find "$shard_root" -type f -name lcov.info -print0 | sort -z
          )
          test "${#shard_reports[@]}" -eq "$expected_report_count" || {
            printf '::error::expected %s Rust coverage reports, found %s\n' \
              "$expected_report_count" "${#shard_reports[@]}"
            exit 1
          }
          policy_report="$shard_root/rust-coverage-lcov-policy/lcov.info"
          test -f "$policy_report"
          test ! -L "$policy_report"
          merge_arguments=(--add-tracefile "$policy_report")
          for ((shard_index = 1; shard_index <= RUST_COVERAGE_SHARD_COUNT; shard_index++)); do
            shard_report="$shard_root/rust-coverage-lcov-shard-$shard_index/lcov.info"
            test -f "$shard_report"
            test ! -L "$shard_report"
            merge_arguments+=(--add-tracefile "$shard_report")
          done
          LC_ALL=C "$LCOV_RUNTIME_BIN" --parallel "$expected_report_count" \
            "${merge_arguments[@]}" --output-file "$merged_report"
          LC_ALL=C awk -F: -v minimum="$RUST_COVERAGE_MIN_LINES" '
            $1 == "LF" {
              found_records++
              if ($2 !~ /^[0-9]+$/) { malformed = 1; next }
              found += $2
            }
            $1 == "LH" {
              hit_records++
              if ($2 !~ /^[0-9]+$/) { malformed = 1; next }
              hit += $2
            }
            END {
              if (malformed || found_records != hit_records || found == 0 || hit > found) {
                print "::error::merged LCOV line totals are malformed" > "/dev/stderr"
                exit 1
              }
              rate = 100 * hit / found
              printf "Summary coverage rate:\n  lines......: %.3f%% (%d of %d lines)\n", rate, hit, found
              if (rate < minimum) {
                printf "::error::line coverage %.3f%% is below %.3f%%\n", rate, minimum > "/dev/stderr"
                exit 1
              }
            }
          ' "$merged_report"
      - name: Upload merged Rust coverage report
        if: steps.verify-mode.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: ${{ runner.temp }}/rust-coverage-merged/lcov.info
          if-no-files-found: error
          overwrite: false

  # Manual profile sweeps remain isolated from the protected production job.
  # They share the coverage validation and timing steps, but do not run the
  # production lane's bootstrap integration checks.
  rust-coverage-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.coverage_profile_benchmark
    name: rust-coverage-benchmark (opt${{ matrix.test_opt_level }} sample${{ matrix.sample }})
    runs-on: ${{ inputs.coverage_profile_runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test_opt_level: ["0", "1"]
        sample: [1, 2, 3]
    env:
      CARGO_NEXTEST_VERSION: "0.9.137"
      CARGO_NEXTEST_ARCHIVE_SHA256: "38fd6275e111b200bbbed1bd2ae91cbb0d7edd28504879875cff2b3d96f3f311"
      CARGO_NEXTEST_BINARY_SHA256: "9c05bd3c7c5da1286b193873f12b37db386485fa483d8fa0554e68a53d9df550"
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_ARCHIVE_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
      CARGO_LLVM_COV_BINARY_SHA256: "8bff2fb8e14655f92d50afe7873945c6e46981505f3f3469683bf11da1ff8042"
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_IGNORE_REGEX: '(^|/)(crates/larch-test-support|tests|fixtures)(/|$)|/build\.rs$'
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: ${{ matrix.test_opt_level }}
      NEXTEST_TEST_THREADS: "16"
      COVERAGE_PROFILE_BENCHMARK: "true"
      COVERAGE_PROFILE_SAMPLE: ${{ matrix.sample }}
      RUST_COVERAGE_PHASE_MODE: sequential
      RUST_COVERAGE_EXECUTION_ROLE: combined
      COVERAGE_LCOV_ARTIFACT_SUFFIX: ${{ format('-opt{0}-sample{1}', matrix.test_opt_level, matrix.sample) }}
      COVERAGE_TIMING_ARTIFACT_SUFFIX: ${{ format('-opt{0}-sample{1}', matrix.test_opt_level, matrix.sample) }}
      COVERAGE_RUN_BOOTSTRAP_INTEGRATION: "false"
      COVERAGE_TARGET_CACHE_ENABLED: "false"
      COVERAGE_TARGET_CACHE_SCHEMA: "v2"
      COVERAGE_TARGET_CACHE_KEY_PREFIX: "coverage-target-deps"
      COVERAGE_TARGET_CACHE_PUBLICATION: "main-cache-candidate"
      COVERAGE_TARGET_CACHE_MAX_BYTES: "0"
      RUST_COVERAGE_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
      RUST_COVERAGE_FEATURE_MODE: "all-features"
      RUST_COVERAGE_LINKER: "runner-default"
    steps:
      - name: Start Rust coverage job timing
        run: |
          set -euo pipefail
          printf 'COVERAGE_JOB_TIMING_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      # `checks run-relevant` spawns `pre-commit`; install it so the coverage
      # run can exercise that path (#8616).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pre-commit for relevant-checks coverage
        run: python -m pip install pre-commit
      - uses: ./.github/actions/rust-coverage
        env:
          CARGO_INPUTS_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
          CARGO_LLVM_COV_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-llvm-cov }}
          CARGO_NEXTEST_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-nextest }}
          COVERAGE_TARGET_CACHE_KEY: ${{ steps.main-cache-keys.outputs.coverage-target }}

  # This opt-in matrix holds the commit, runner, cache policy, toolchain,
  # profile, and test-thread count constant while comparing the control with
  # a bounded same-runner test/policy overlap candidate. It is deliberately
  # outside the protected aggregate until paired evidence proves a win.
  rust-phase-overlap-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.rust_phase_overlap_benchmark
    name: rust-phase-overlap-benchmark (${{ matrix.phase_mode }} sample${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase_mode: [sequential, parallel]
        sample: [1, 2, 3]
    env:
      CARGO_NEXTEST_VERSION: "0.9.137"
      CARGO_NEXTEST_ARCHIVE_SHA256: "38fd6275e111b200bbbed1bd2ae91cbb0d7edd28504879875cff2b3d96f3f311"
      CARGO_NEXTEST_BINARY_SHA256: "9c05bd3c7c5da1286b193873f12b37db386485fa483d8fa0554e68a53d9df550"
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_ARCHIVE_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
      CARGO_LLVM_COV_BINARY_SHA256: "8bff2fb8e14655f92d50afe7873945c6e46981505f3f3469683bf11da1ff8042"
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_IGNORE_REGEX: '(^|/)(crates/larch-test-support|tests|fixtures)(/|$)|/build\.rs$'
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      NEXTEST_TEST_THREADS: "16"
      COVERAGE_PROFILE_BENCHMARK: "false"
      COVERAGE_PROFILE_SAMPLE: ${{ matrix.sample }}
      RUST_COVERAGE_PHASE_MODE: ${{ matrix.phase_mode }}
      RUST_COVERAGE_EXECUTION_ROLE: combined
      COVERAGE_LCOV_ARTIFACT_SUFFIX: ${{ format('-overlap-{0}-sample{1}', matrix.phase_mode, matrix.sample) }}
      COVERAGE_TIMING_ARTIFACT_SUFFIX: ${{ format('-overlap-{0}-sample{1}', matrix.phase_mode, matrix.sample) }}
      COVERAGE_RUN_BOOTSTRAP_INTEGRATION: "false"
      COVERAGE_TARGET_CACHE_ENABLED: "true"
      COVERAGE_TARGET_CACHE_SCHEMA: "v2"
      COVERAGE_TARGET_CACHE_KEY_PREFIX: "coverage-target-deps"
      COVERAGE_TARGET_CACHE_PUBLICATION: "main-cache-candidate"
      COVERAGE_TARGET_CACHE_MAX_BYTES: "1400000000"
      RUST_COVERAGE_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
      RUST_COVERAGE_FEATURE_MODE: "all-features"
      RUST_COVERAGE_LINKER: "runner-default"
    steps:
      - name: Start Rust coverage job timing
        run: |
          set -euo pipefail
          printf 'COVERAGE_JOB_TIMING_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      # `checks run-relevant` spawns `pre-commit`; install it so the coverage
      # run can exercise that path (#8616).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pre-commit for relevant-checks coverage
        run: python -m pip install pre-commit
      - uses: ./.github/actions/rust-coverage
        env:
          CARGO_INPUTS_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
          CARGO_LLVM_COV_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-llvm-cov }}
          CARGO_NEXTEST_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-nextest }}
          COVERAGE_TARGET_CACHE_KEY: ${{ steps.main-cache-keys.outputs.coverage-target }}
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}

  # This manual job supplies matched cache-on measurements while the full shard
  # and policy path remains the cache-off control. Its cache key is isolated
  # from production and may only be published by this explicitly requested
  # main-ref benchmark, never by a pull request or normal dispatch.
  rust-coverage-target-cache-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.coverage_target_cache_benchmark && github.ref == 'refs/heads/main'
    name: rust-coverage-target-cache-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NEXTEST_VERSION: "0.9.137"
      CARGO_NEXTEST_ARCHIVE_SHA256: "38fd6275e111b200bbbed1bd2ae91cbb0d7edd28504879875cff2b3d96f3f311"
      CARGO_NEXTEST_BINARY_SHA256: "9c05bd3c7c5da1286b193873f12b37db386485fa483d8fa0554e68a53d9df550"
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_ARCHIVE_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
      CARGO_LLVM_COV_BINARY_SHA256: "8bff2fb8e14655f92d50afe7873945c6e46981505f3f3469683bf11da1ff8042"
      RUST_COVERAGE_MIN_LINES: "88.000"
      RUST_COVERAGE_IGNORE_REGEX: '(^|/)(crates/larch-test-support|tests|fixtures)(/|$)|/build\.rs$'
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      NEXTEST_TEST_THREADS: "16"
      COVERAGE_PROFILE_BENCHMARK: "false"
      COVERAGE_PROFILE_SAMPLE: "target-cache-benchmark"
      RUST_COVERAGE_PHASE_MODE: sequential
      RUST_COVERAGE_EXECUTION_ROLE: combined
      COVERAGE_LCOV_ARTIFACT_SUFFIX: "-target-cache-benchmark"
      COVERAGE_TIMING_ARTIFACT_SUFFIX: "-target-cache-benchmark"
      COVERAGE_RUN_BOOTSTRAP_INTEGRATION: "false"
      COVERAGE_TARGET_CACHE_ENABLED: "true"
      COVERAGE_TARGET_CACHE_SCHEMA: "v2"
      COVERAGE_TARGET_CACHE_KEY_PREFIX: "coverage-target-deps-benchmark"
      COVERAGE_TARGET_CACHE_PUBLICATION: "main-dispatch-benchmark"
      COVERAGE_TARGET_CACHE_MAX_BYTES: ${{ inputs.coverage_target_cache_benchmark_max_bytes }}
      COVERAGE_TARGET_CACHE_MAX_BYTES_CAP: "2147483648"
      RUST_COVERAGE_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
      RUST_COVERAGE_FEATURE_MODE: "all-features"
      RUST_COVERAGE_LINKER: "runner-default"
    steps:
      - name: Validate coverage target cache benchmark bound
        shell: bash
        run: |
          set -euo pipefail
          max_bytes="${COVERAGE_TARGET_CACHE_MAX_BYTES:?}"
          max_bytes_cap="${COVERAGE_TARGET_CACHE_MAX_BYTES_CAP:?}"
          case "$max_bytes" in
            ''|*[!0-9]*) printf 'invalid coverage target cache benchmark bound: %s\n' "$max_bytes" >&2; exit 1 ;;
          esac
          case "$max_bytes_cap" in
            ''|*[!0-9]*) printf 'invalid coverage target cache benchmark cap: %s\n' "$max_bytes_cap" >&2; exit 1 ;;
          esac
          if [ "${#max_bytes}" -gt "${#max_bytes_cap}" ] \
            || { [ "${#max_bytes}" -eq "${#max_bytes_cap}" ] && [[ "$max_bytes" > "$max_bytes_cap" ]]; }; then
            printf 'coverage target cache benchmark bound exceeds cap: %s > %s\n' \
              "$max_bytes" "$max_bytes_cap" >&2
            exit 1
          fi
      - name: Start Rust coverage job timing
        run: |
          set -euo pipefail
          printf 'COVERAGE_JOB_TIMING_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
        with:
          coverage-target-key-prefix: coverage-target-deps-benchmark
      - uses: ./.github/actions/rust-coverage
        env:
          CARGO_INPUTS_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
          CARGO_LLVM_COV_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-llvm-cov }}
          CARGO_NEXTEST_CACHE_KEY: ${{ steps.main-cache-keys.outputs.cargo-nextest }}
          COVERAGE_TARGET_CACHE_KEY: ${{ steps.main-cache-keys.outputs.coverage-target }}
          RUST_POLICY_INPUTS_SHA256: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'build.rs', 'crates/**/*.rs', '.cargo/**') }}

  # Keep the aggregate branch-protection name while starting it beside
  # rust-coverage. It independently rejects failed lint, dependency policy, or
  # execution producers. `if: always()` prevents skipped dependencies from
  # passing accidentally.
  rust-gate:
    name: rust-gate
    needs: [rust-lint, rust-deny, rust-full-shards, rust-full-policy, rust-partial, rust-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust lane to pass
        run: |
          set -euo pipefail
          lint_result="${{ needs.rust-lint.result }}"
          deny_result="${{ needs.rust-deny.result }}"
          full_shards_result="${{ needs.rust-full-shards.result }}"
          full_policy_result="${{ needs.rust-full-policy.result }}"
          partial_result="${{ needs.rust-partial.result }}"
          skip_result="${{ needs.rust-skip.result }}"
          [ "$lint_result" = success ] || { echo "::error::rust-lint result=$lint_result"; exit 1; }
          [ "$deny_result" = success ] || { echo "::error::rust-deny result=$deny_result"; exit 1; }
          case "$full_shards_result:$full_policy_result:$partial_result:$skip_result" in
            success:success:skipped:skipped|skipped:skipped:success:skipped|skipped:skipped:skipped:success) ;;
            *)
              printf '::error::invalid Rust producer results: shards=%s policy=%s partial=%s skip=%s\n' \
                "$full_shards_result" "$full_policy_result" "$partial_result" "$skip_result"
              exit 1
              ;;
          esac

  contains-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build larch executable
        run: |
          set -euo pipefail
          cargo build --package larch-cli --bin larch --all-features --locked
          test -x "$GITHUB_WORKSPACE/target/debug/larch"
      - name: Run contains-pin scanner
        run: |
          set -euo pipefail
          CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$GITHUB_WORKSPACE/target/debug/larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" checks contains-pins

  # Dedicated gitleaks gate — runs two sequential scans: (1) working-tree
  # scan (`--no-git`; formerly run inside the `lint` pre-commit hook, moved
  # here to reduce `lint`'s wall-clock time) and (2) git-history scan
  # (covers the PR commit range; `fetch-depth: 0` supports merge-base lookup).
  # CI uses a separate checksum-pinned release bootstrap from local pre-commit.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GITLEAKS_VERSION: "8.18.4"
      GITLEAKS_ARCHIVE_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
      GITLEAKS_BINARY_SHA256: "46a05260e7cce527f132cb618de59d22262b8b5eb47f66c288447b95c7a98b7e"
    steps:
      - name: Start gitleaks checkout timing
        id: gitleaks-checkout-start
        run: printf 'epoch_seconds=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout gitleaks source
        id: gitleaks-checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - name: Record gitleaks checkout timing
        id: gitleaks-checkout-timing
        run: |
          set -euo pipefail
          checkout_started="${{ steps.gitleaks-checkout-start.outputs.epoch_seconds }}"
          case "$checkout_started" in
            ''|*[!0-9]*)
              echo "::error::gitleaks checkout start time is invalid"
              exit 1
              ;;
          esac
          checkout_seconds="$(( $(date +%s) - checkout_started ))"
          test "$checkout_seconds" -ge 0
          printf 'seconds=%s\n' "$checkout_seconds" >> "$GITHUB_OUTPUT"
      # These exact trusted-main restores supply only Cargo inputs and pruned
      # dependency products. Cargo still builds the current history resolver.
      - name: Restore Cargo inputs for typed gitleaks history resolver
        id: cargo-inputs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
      - name: Restore Rust lint dependencies for typed gitleaks history resolver
        id: rust-lint-deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/debug
          key: ${{ steps.main-cache-keys.outputs.rust-lint-deps }}
      - name: Build typed gitleaks history resolver
        id: gitleaks-rust-bootstrap
        run: |
          set -euo pipefail
          cargo build --locked --package larch-cli --bin larch
          printf 'seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
      # The named checkout, preparation, and scan steps expose the complete
      # cold/warm phase timing surface in GitHub Actions. The cache hit in the
      # summary below distinguishes warm scanner preparation from a download.
      - name: Restore verified gitleaks binary
        id: gitleaks-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/larch/tools/gitleaks
          key: ${{ steps.main-cache-keys.outputs.gitleaks }}
      - name: Prepare verified gitleaks release
        id: prepare-gitleaks
        uses: ./.github/actions/gitleaks-bootstrap
      - name: Scan working tree
        id: scan-working-tree
        run: |
          set -euo pipefail
          gitleaks_binary="${HOME}/.cache/larch/tools/gitleaks/${GITLEAKS_VERSION}/linux-x64/gitleaks"
          run_gitleaks() {
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              TMPDIR="${TMPDIR:-/tmp}" \
              LANG="${LANG:-C.UTF-8}" \
              GIT_TERMINAL_PROMPT=0 \
              "$gitleaks_binary" "$@"
          }
          test -f "$gitleaks_binary" && test ! -L "$gitleaks_binary"
          printf '%s  %s\n' "$GITLEAKS_BINARY_SHA256" "$gitleaks_binary" | sha256sum --check --strict --status -
          test "$(run_gitleaks version)" = "$GITLEAKS_VERSION"
          test -f .gitleaks.toml && test ! -L .gitleaks.toml
          run_gitleaks detect --source . --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner --no-git
          printf 'seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Scan git history
        id: scan-history
        run: |
          set -euo pipefail
          # Limit scan to new commits in this PR to avoid false positives from
          # historical test-fixture keys in the main branch.
          history_larch="$GITHUB_WORKSPACE/target/debug/larch"
          BASE="$(CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" LARCH_BINARY="$history_larch" \
            "$GITHUB_WORKSPACE/scripts/larch.sh" ci gitleaks-base \
              --repo-root "$GITHUB_WORKSPACE" --base-ref origin/main)"
          gitleaks_binary="${HOME}/.cache/larch/tools/gitleaks/${GITLEAKS_VERSION}/linux-x64/gitleaks"
          run_gitleaks() {
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              TMPDIR="${TMPDIR:-/tmp}" \
              LANG="${LANG:-C.UTF-8}" \
              GIT_TERMINAL_PROMPT=0 \
              "$gitleaks_binary" "$@"
          }
          test -f "$gitleaks_binary" && test ! -L "$gitleaks_binary"
          printf '%s  %s\n' "$GITLEAKS_BINARY_SHA256" "$gitleaks_binary" | sha256sum --check --strict --status -
          test "$(run_gitleaks version)" = "$GITLEAKS_VERSION"
          test -f .gitleaks.toml && test ! -L .gitleaks.toml
          run_gitleaks detect --source . --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner --log-opts "${BASE}..HEAD"
          printf 'seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Record gitleaks phase timing metadata
        if: always()
        run: |
          {
            echo "## Gitleaks timing metadata"
            echo "- cache_hit: ${{ steps.gitleaks-cache.outputs.cache-hit }}"
            echo "- cargo_inputs_cache_hit: ${{ steps.cargo-inputs-cache.outputs.cache-hit }}"
            echo "- rust_lint_deps_cache_hit: ${{ steps.rust-lint-deps-cache.outputs.cache-hit }}"
            echo "- checkout_seconds: ${{ steps.gitleaks-checkout-timing.outputs.seconds }}"
            echo "- rust_bootstrap_seconds: ${{ steps.gitleaks-rust-bootstrap.outputs.seconds }}"
            echo "- rust_bootstrap: typed larch history resolver"
            echo "- verified_tool_preparation_seconds: ${{ steps.prepare-gitleaks.outputs.seconds }}"
            echo "- working_tree_scan_seconds: ${{ steps.scan-working-tree.outputs.seconds }}"
            echo "- history_scan_seconds: ${{ steps.scan-history.outputs.seconds }}"
          } >> "$GITHUB_STEP_SUMMARY"


  # Generator and local metadata drift checks. Uses a sparse checkout because
  # Legacy larch-logs fixtures are not part of the generated runtime surface.
  agent-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/larch-logs/
          sparse-checkout-cone-mode: false
      - id: main-cache-keys
        uses: ./.github/actions/main-cache-keys
      - name: Restore Cargo inputs
        id: cargo-inputs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.main-cache-keys.outputs.cargo-inputs }}
      - name: Restore Rust lint dependencies
        id: rust-lint-deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/debug
          key: ${{ steps.main-cache-keys.outputs.rust-lint-deps }}
      # The canonical Rust rule owns the same checked reviewer surfaces and
      # security-on-enumeration semantics as the retired shell assertion.
      - name: Run generated and reviewer metadata checks
        id: agent-sync-rust-bootstrap
        run: |
          set -euo pipefail
          make agent-sync
          printf 'seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Record agent-sync cache timing metadata
        if: always()
        run: |
          {
            echo "## Agent sync cache timing metadata"
            echo "- cargo_inputs_cache_hit: ${{ steps.cargo-inputs-cache.outputs.cache-hit }}"
            echo "- rust_lint_deps_cache_hit: ${{ steps.rust-lint-deps-cache.outputs.cache-hit }}"
            echo "- rust_bootstrap_seconds: ${{ steps.agent-sync-rust-bootstrap.outputs.seconds }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Full-checkout verified secret scan. Kept separate from `agent-sync` so
  # generated-file checks can use sparse checkout without weakening scan scope.
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Trufflehog verified-only scan. Independent of gitleaks — catches
      # credentials that authenticate against a live provider API even if
      # gitleaks' regex rules miss them. Action pinned to commit SHA
      # (supply-chain: tags are mutable; a force-pushed tag could silently
      # swap the scanner binary). `version: 3.82.13` also pins the scanner
      # Docker image so both action driver and scanner engine are pinned.
      # Pinned to commit SHA for v3.82.13 (verify with
      # `git ls-remote https://github.com/trufflesecurity/trufflehog refs/tags/v3.82.13`).
      # Pre-pull the Docker image with exponential-backoff retry so a transient
      # GHCR blip is retried before the action runs. The action then reuses the
      # locally-present image. Image ref verified against the action's action.yml
      # at the pinned SHA above (image: ghcr.io/trufflesecurity/trufflehog:${VERSION}).
      # Best-effort: GHCR hardening for a Docker action is necessarily partial.
      - name: Pre-pull trufflehog image (exponential-backoff retry)
        run: |
          set -euo pipefail
          img="ghcr.io/trufflesecurity/trufflehog:3.82.13"
          for attempt in 1 2 3 4 5; do
            if docker pull "$img"; then exit 0; fi
            echo "trufflehog image pull attempt $attempt failed; backing off $((2 ** attempt))s..." >&2
            sleep $(( 2 ** attempt ))
          done
          echo "::error::failed to pull $img after 5 attempts" >&2
          exit 1
      - uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39
        with:
          version: 3.82.13
          path: ./
          extra_args: --only-verified
