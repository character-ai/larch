name: Rust release assets

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_DATE_EPOCH: "0"

concurrency:
  group: rust-release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.VERSION }}
      source_commit: ${{ steps.identity.outputs.SOURCE_COMMIT }}
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo --version
      - name: Cache Rust build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # GitHub cache entries are immutable. Include Rust sources so a
          # successful Rust change publishes its updated workspace binaries.
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'Makefile') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'Makefile') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build the host release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package larch-cli
      - name: Validate release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out commit does not match the tag event commit"
            exit 1
          fi
          ./target/release/larch release asset-candidate \
            --repo-root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$source_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            architecture: arm64
            deployment_target: "11.0"
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          cargo --version
          rustc --version --verbose
      - name: Build and smoke-test on macOS
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          cargo test --locked --package larch-test-support --package larch-adapters --package larch-cli --target "$TARGET"
          cargo build --locked --release --package larch-cli --target "$TARGET"
          binary="target/$TARGET/release/larch"
          file "$binary" | grep -F "$EXPECTED_ARCHITECTURE"
          actual_version="$("$binary" --version)"
          test "$actual_version" = "larch $VERSION"
          minimum="$({
            otool -l "$binary" | awk '
              $1 == "cmd" && ($2 == "LC_BUILD_VERSION" || $2 == "LC_VERSION_MIN_MACOSX") { found = 1; next }
              found && ($1 == "minos" || $1 == "version") { print $2; exit }
            '
          })"
          test "$minimum" = "$MACOSX_DEPLOYMENT_TARGET"
          codesign --force --sign - --timestamp=none "$binary"
          codesign --verify --verbose=2 "$binary"
      - name: Package deterministic archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          "./target/$TARGET/release/larch" release package-asset \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --target "$TARGET" \
            --binary "$GITHUB_WORKSPACE/target/$TARGET/release/larch" \
            --license "$GITHUB_WORKSPACE/LICENSE" \
            --output-dir "$GITHUB_WORKSPACE/dist"
      - name: Attest archive provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/larch-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
      - name: Upload matrix output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larch-build-${{ matrix.target }}
          path: |
            dist/larch-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/larch-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.asset.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  collect:
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo --version
      - name: Cache Rust build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # GitHub cache entries are immutable. Include Rust sources so a
          # successful Rust change publishes its updated workspace binaries.
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'Makefile') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'Makefile') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build the host release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package larch-cli
      - name: Download every matrix output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: larch-build-*
          path: incoming
      - name: Collect and validate exact assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          ./target/release/larch release collect-assets \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --input-dir "$GITHUB_WORKSPACE/incoming" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --license "$GITHUB_WORKSPACE/LICENSE"
      - name: Attest manifest and checksums
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/larch-v${{ needs.metadata.outputs.version }}-manifest.json
            dist/larch-v${{ needs.metadata.outputs.version }}-SHA256SUMS
      - name: Validate assets and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          export GH_CONFIG_DIR="$RUNNER_TEMP/larch-gh"
          mkdir -p "$GH_CONFIG_DIR"
          chmod 700 "$GH_CONFIG_DIR"
          printf '%s' "$GH_TOKEN" | env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$GH_CONFIG_DIR" gh auth login --hostname github.com --with-token
          unset GH_TOKEN GITHUB_TOKEN
          ./target/release/larch release validate-assets \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --asset-dir "$GITHUB_WORKSPACE/dist" \
            --license "$GITHUB_WORKSPACE/LICENSE" \
            --verify-attestations
      - name: Upload the validated set to the draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,isImmutable,tagName)"
          release_id="$(jq -r '.databaseId' <<<"$release_state")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r '.isDraft' <<<"$release_state")" = "true"
          test "$(jq -r '.isImmutable' <<<"$release_state")" = "false"
          test "$(jq -r '.tagName' <<<"$release_state")" = "$GITHUB_REF_NAME"
          release_assets=(
            "dist/larch-v$VERSION-aarch64-apple-darwin.tar.gz"
            "dist/larch-v$VERSION-manifest.json"
            "dist/larch-v$VERSION-SHA256SUMS"
          )
          gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          remote_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.assets | map(select(.state == "uploaded" and (.digest | startswith("sha256:")))) | map(.name) | sort | .[]')"
          local_names="$(printf '%s\n' "${release_assets[@]##*/}" | sort)"
          test "$remote_names" = "$local_names"
      - name: Upload validated release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larch-v${{ needs.metadata.outputs.version }}-release-assets
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
