name: Rust coverage execution
description: Run the shared coverage, validation, artifact, cache, and timing steps.

runs:
  using: composite
  steps:
    - name: Initialize Rust coverage phase timing
      shell: bash
      run: |
        set -euo pipefail
        timing_file="$RUNNER_TEMP/rust-coverage-phases.tsv"
        printf 'phase\tseconds\toutcome\tdetail\n' > "$timing_file"
        target_inventory="$RUNNER_TEMP/coverage-target-cache-inventory.tsv"
        case "${COVERAGE_TARGET_CACHE_ENABLED:?}" in
          true|false) ;;
          *) printf 'invalid coverage target cache enabled value: %s\n' "$COVERAGE_TARGET_CACHE_ENABLED" >&2; exit 1 ;;
        esac
        case "${COVERAGE_TARGET_CACHE_PUBLICATION:?}" in
          main-push|main-dispatch-benchmark) ;;
          *) printf 'invalid coverage target cache publication: %s\n' "$COVERAGE_TARGET_CACHE_PUBLICATION" >&2; exit 1 ;;
        esac
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          target_cache_policy="$COVERAGE_TARGET_CACHE_PUBLICATION"
        else
          target_cache_policy=disabled-unmeasured
        fi
        printf 'kind\tvalue\npolicy\t%s\n' "$target_cache_policy" > "$target_inventory"
        {
          printf 'COVERAGE_TIMING_FILE=%s\n' "$timing_file"
          printf 'COVERAGE_TARGET_CACHE_INVENTORY=%s\n' "$target_inventory"
          printf 'COVERAGE_TARGET_CACHE_HIT=disabled\n'
          printf 'COVERAGE_TARGET_CACHE_RESTORE_OUTCOME=disabled-unmeasured\n'
          printf 'COVERAGE_TARGET_CACHE_RESTORE_SECONDS=0\n'
          printf 'COVERAGE_TARGET_CACHE_RESTORED_BYTES=unavailable\n'
          printf 'COVERAGE_TARGET_CACHE_PRUNE_OUTCOME=disabled-unmeasured\n'
          printf 'COVERAGE_TARGET_CACHE_POST_PRUNE_BYTES=unavailable\n'
          printf 'COVERAGE_TARGET_CACHE_SAVE_ALLOWED=false\n'
          printf 'COVERAGE_TARGET_CACHE_SAVE_OUTCOME=disabled-unmeasured\n'
          printf 'COVERAGE_TARGET_CACHE_SAVE_SECONDS=0\n'
          printf 'COVERAGE_TARGET_CACHE_SAVE_REASON=three-comparable-warm-samples-required\n'
        } >> "$GITHUB_ENV"
    - name: Start Rust coverage cache restore timing
      shell: bash
      run: |
        set -euo pipefail
        printf 'COVERAGE_CACHE_RESTORE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
    - name: Restore cargo-nextest binary
      id: nextest-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_NEXTEST_VERSION }}
    - name: Restore cargo-llvm-cov binary
      id: llvm-cov-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: cargo-llvm-cov-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_LLVM_COV_VERSION }}
    - name: Restore Cargo inputs
      id: cargo-inputs-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}
    - name: Start coverage dependency cache restore timing
      shell: bash
      run: |
        set -euo pipefail
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          printf 'COVERAGE_TARGET_CACHE_RESTORE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
        else
          printf 'COVERAGE_TARGET_CACHE_RESTORE_STARTED=0\n' >> "$GITHUB_ENV"
        fi
    # Keep coverage compiler dependencies separate from Cargo inputs and the
    # two tool binaries. There is intentionally no restore-keys fallback:
    # a related but incompatible target can cost more to transfer than it
    # saves to compile.
    - name: Restore coverage dependencies
      id: coverage-target-cache
      if: env.COVERAGE_TARGET_CACHE_ENABLED == 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: target/llvm-cov-target
        key: ${{ env.COVERAGE_TARGET_CACHE_KEY_PREFIX }}-${{ env.COVERAGE_TARGET_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_COVERAGE_TARGET_TRIPLE }}-${{ env.CARGO_LLVM_COV_VERSION }}-opt${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-test-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-incremental${{ env.CARGO_INCREMENTAL }}-features${{ env.RUST_COVERAGE_FEATURE_MODE }}-linker${{ env.RUST_COVERAGE_LINKER }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml', '.cargo/**') }}
    - name: Record Rust coverage cache restore timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        started="${COVERAGE_CACHE_RESTORE_STARTED:?}"
        finished="$(date +%s)"
        outcomes="cargo-inputs=${{ steps.cargo-inputs-cache.outcome }};cargo-nextest=${{ steps.nextest-cache.outcome }};cargo-llvm-cov=${{ steps.llvm-cov-cache.outcome }};coverage-target=${{ steps.coverage-target-cache.outcome }}"
        case "$outcomes" in
          *failure*) outcome=failure ;;
          *) outcome=success ;;
        esac
        printf 'cache-restore\t%s\t%s\t%s\n' "$((finished - started))" "$outcome" \
          "${outcomes};hits=cargo-inputs:${{ steps.cargo-inputs-cache.outputs.cache-hit }},cargo-nextest:${{ steps.nextest-cache.outputs.cache-hit }},cargo-llvm-cov:${{ steps.llvm-cov-cache.outputs.cache-hit }}" \
          >> "$COVERAGE_TIMING_FILE"
    - name: Record coverage dependency cache restore diagnostics
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          started="${COVERAGE_TARGET_CACHE_RESTORE_STARTED:?}"
          finished="$(date +%s)"
          restore_seconds="$((finished - started))"
          restore_step_outcome="${{ steps.coverage-target-cache.outcome }}"
          cache_hit="${{ steps.coverage-target-cache.outputs.cache-hit }}"
          case "$restore_step_outcome" in
            success)
              case "$cache_hit" in
                true) restore_outcome=hit ;;
                false|'') restore_outcome=miss ;;
                *) printf 'unexpected coverage target cache-hit value: %s\n' "$cache_hit" >&2; exit 1 ;;
              esac
              ;;
            failure) restore_outcome=failure ;;
            *) printf 'unexpected coverage target restore outcome: %s\n' "$restore_step_outcome" >&2; exit 1 ;;
          esac
        else
          cache_hit=disabled
          restore_seconds=0
          restore_outcome=disabled-unmeasured
        fi
        # actions/cache does not expose a restored-byte output. Keep that
        # absence explicit rather than deriving bytes from a later directory.
        restored_bytes=unavailable
        {
          printf 'COVERAGE_TARGET_CACHE_HIT=%s\n' "$cache_hit"
          printf 'COVERAGE_TARGET_CACHE_RESTORE_OUTCOME=%s\n' "$restore_outcome"
          printf 'COVERAGE_TARGET_CACHE_RESTORE_SECONDS=%s\n' "$restore_seconds"
          printf 'COVERAGE_TARGET_CACHE_RESTORED_BYTES=%s\n' "$restored_bytes"
        } >> "$GITHUB_ENV"
        printf 'coverage-target-cache-restore\t%s\t%s\thit=%s;restored_bytes=%s\n' \
          "$restore_seconds" "$restore_outcome" "$cache_hit" "$restored_bytes" >> "$COVERAGE_TIMING_FILE"
    - name: Start Rust coverage tool setup timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        printf 'COVERAGE_TOOL_SETUP_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
    - name: Install cargo-nextest
      id: install-nextest
      if: steps.nextest-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        test "${RUNNER_OS}-${RUNNER_ARCH}" = "Linux-X64"
        nextest_tmp="$(mktemp -d)"
        trap 'rm -rf "$nextest_tmp"' EXIT
        nextest_archive="$nextest_tmp/cargo-nextest.tar.gz"
        curl -sSfL --retry 5 --retry-max-time 120 --retry-all-errors --connect-timeout 10 --max-time 120 \
          -o "$nextest_archive" \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        printf '%s  %s\n' "$CARGO_NEXTEST_ARCHIVE_SHA256" "$nextest_archive" | sha256sum --check --strict
        test "$(tar -tzf "$nextest_archive")" = "cargo-nextest"
        tar -xzf "$nextest_archive" -C "$nextest_tmp"
        test -f "$nextest_tmp/cargo-nextest"
        test ! -L "$nextest_tmp/cargo-nextest"
        install -m 0755 "$nextest_tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
    - name: Install cargo-llvm-cov
      id: install-llvm-cov
      if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        test "${RUNNER_OS}-${RUNNER_ARCH}" = "Linux-X64"
        llvm_cov_tmp="$(mktemp -d)"
        trap 'rm -rf "$llvm_cov_tmp"' EXIT
        llvm_cov_archive="$llvm_cov_tmp/cargo-llvm-cov.tar.gz"
        curl -sSfL --retry 5 --retry-max-time 120 --retry-all-errors --connect-timeout 10 --max-time 120 \
          -o "$llvm_cov_archive" \
          "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
        printf '%s  %s\n' "$CARGO_LLVM_COV_ARCHIVE_SHA256" "$llvm_cov_archive" | sha256sum --check --strict
        test "$(tar -tzf "$llvm_cov_archive")" = "cargo-llvm-cov"
        tar -xzf "$llvm_cov_archive" -C "$llvm_cov_tmp"
        test -f "$llvm_cov_tmp/cargo-llvm-cov"
        test ! -L "$llvm_cov_tmp/cargo-llvm-cov"
        install -m 0755 "$llvm_cov_tmp/cargo-llvm-cov" "$HOME/.cargo/bin/cargo-llvm-cov"
    - name: Verify pinned coverage tools
      id: verify-coverage-tools
      shell: bash
      run: |
        set -euo pipefail
        printf '%s  %s\n' "$CARGO_NEXTEST_BINARY_SHA256" "$HOME/.cargo/bin/cargo-nextest" | sha256sum --check --strict
        printf '%s  %s\n' "$CARGO_LLVM_COV_BINARY_SHA256" "$HOME/.cargo/bin/cargo-llvm-cov" | sha256sum --check --strict
        nextest_version="$(cargo nextest --version)"
        case "$nextest_version" in
          "cargo-nextest ${CARGO_NEXTEST_VERSION}"*) ;;
          *) printf 'unexpected cargo-nextest version: %s\n' "$nextest_version" >&2; exit 1 ;;
        esac
        test "$(cargo llvm-cov --version)" = "cargo-llvm-cov ${CARGO_LLVM_COV_VERSION}"
    - name: Install llvm-tools component
      id: install-llvm-tools
      shell: bash
      run: rustup component add llvm-tools-preview
    - name: Record Rust coverage tool setup timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        started="${COVERAGE_TOOL_SETUP_STARTED:?}"
        finished="$(date +%s)"
        outcomes="nextest-install=${{ steps.install-nextest.outcome }};llvm-cov-install=${{ steps.install-llvm-cov.outcome }};verify=${{ steps.verify-coverage-tools.outcome }};llvm-tools=${{ steps.install-llvm-tools.outcome }}"
        case "$outcomes" in
          *failure*) outcome=failure ;;
          *"verify=skipped"*|*"llvm-tools=skipped"*) outcome=skipped ;;
          *) outcome=success ;;
        esac
        printf 'tool-setup\t%s\t%s\t%s\n' "$((finished - started))" "$outcome" "$outcomes" \
          >> "$COVERAGE_TIMING_FILE"
    - name: Run Rust coverage phases
      shell: bash
      run: |
        set -euo pipefail

        run_timed() {
          phase="$1"
          shift
          started="$(date +%s)"
          if "$@"; then
            result=0
            outcome=success
          else
            result=$?
            outcome=failure
          fi
          finished="$(date +%s)"
          printf '%s\t%s\t%s\texit=%s\n' "$phase" "$((finished - started))" "$outcome" "$result" \
            >> "$COVERAGE_TIMING_FILE"
          return "$result"
        }

        profile_started="$(date +%s)"
        run_timed profile-cleanup cargo llvm-cov clean --workspace
        coverage_target_dir="$GITHUB_WORKSPACE/target/llvm-cov-target"
        compile_coverage() (
          eval "$(cargo llvm-cov show-env --sh)" &&
          unset CARGO_LLVM_COV_SHOW_ENV &&
          cargo nextest run --workspace --all-features --locked \
            --target-dir "$coverage_target_dir" --no-run &&
          # nextest compiles test executables, but the top-level CLI is not
          # guaranteed to be one of them. Build it with Cargo's test profile
          # under the same coverage environment and target directory for
          # downstream validation and Python integration tests, rather than
          # compiling the CLI again with the dev profile.
          cargo build --profile test --package larch-cli --bin larch --all-features --locked \
            --target-dir "$coverage_target_dir"
        )
        run_timed compilation compile_coverage
        # Reuse the coverage-instrumented target and compiler environment.
        # This keeps required doctests visible and locked without rebuilding
        # the workspace in Cargo's default target directory.
        run_doctests() (
          eval "$(cargo llvm-cov show-env --sh)" &&
          unset CARGO_LLVM_COV_SHOW_ENV &&
          cargo test --doc --workspace --all-features --locked \
            --target-dir "$coverage_target_dir"
        )
        run_timed doctests run_doctests
        prepared_finished="$(date +%s)"

        run_repository_policy() (
          test_threads="$1"
          coverage_larch="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/larch"
          # The executable is built under the coverage profile, but direct
          # execution needs the same profile destination that llvm-cov
          # reports below. Keep this in a subshell so it cannot affect the
          # next profile-cleanup or report path.
          test -x "$coverage_larch" &&
          eval "$(CARGO_TARGET_DIR="$coverage_target_dir" cargo llvm-cov show-env --sh)" &&
          unset CARGO_LLVM_COV_SHOW_ENV &&
          "$coverage_larch" --version &&
          "$coverage_larch" lint all \
            --timing-file "$RUNNER_TEMP/rust-repository-policy-rules-${test_threads}.tsv"
        )

        thread_counts="$NEXTEST_TEST_THREADS"
        if [ "$COVERAGE_PROFILE_BENCHMARK" = true ]; then
          thread_counts="4 6 8 10 12 14 16"
        fi

        mkdir -p target/llvm-cov
        for test_threads in $thread_counts; do
          thread_started="$(date +%s)"
          run_timed "profile-cleanup-${test_threads}" cargo llvm-cov clean --profraw-only
          run_timed "test-execution-${test_threads}" cargo llvm-cov nextest --no-report \
            --workspace --all-features --locked --test-threads "$test_threads" \
            --status-level slow --final-status-level slow
          # Keep exactly one full policy scan in every coverage path, before
          # its report, so the unchanged 88% line gate includes it.
          run_timed "repository-policy-${test_threads}" \
            run_repository_policy "$test_threads"
          if run_timed "coverage-report-${test_threads}" cargo llvm-cov report \
            --ignore-filename-regex "${RUST_COVERAGE_IGNORE_REGEX}" \
            --lcov --output-path target/llvm-cov/lcov.info \
            --fail-under-lines "${RUST_COVERAGE_MIN_LINES}"; then
            report_result=0
            total_outcome=success
          else
            report_result=$?
            total_outcome=failure
          fi
          thread_finished="$(date +%s)"
          printf 'end-to-end-total-%s\t%s\t%s\tcoverage-phases-common-plus-thread;exit=%s\n' \
            "$test_threads" "$((prepared_finished - profile_started + thread_finished - thread_started))" \
            "$total_outcome" "$report_result" \
            >> "$COVERAGE_TIMING_FILE"
          if [ "$report_result" -ne 0 ]; then
            exit "$report_result"
          fi
        done
    - name: Run plugin validations with coverage executable
      id: plugin-validation
      env:
        LLVM_PROFILE_FILE: ${{ runner.temp }}/larch-coverage-validation-%p.profraw
      shell: bash
      run: |
        set -euo pipefail
        started="$(date +%s)"
        coverage_larch="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/larch"
        if test -x "$coverage_larch" \
          && "$coverage_larch" --version \
          && "$coverage_larch" release plugin-runtime \
          && "$coverage_larch" release plugin-runtime --check; then
          result=0
          outcome=success
        else
          result=$?
          outcome=failure
        fi
        finished="$(date +%s)"
        printf 'plugin-validation\t%s\t%s\texit=%s;binary=%s\n' \
          "$((finished - started))" "$outcome" "$result" "$coverage_larch" \
          >> "$COVERAGE_TIMING_FILE"
        exit "$result"
    - name: Upload Rust coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-coverage-lcov${{ env.COVERAGE_LCOV_ARTIFACT_SUFFIX }}
        path: target/llvm-cov/lcov.info
        if-no-files-found: error
    - name: Upload Rust repository policy rule timings
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-repository-policy-rule-timings${{ env.COVERAGE_TIMING_ARTIFACT_SUFFIX }}
        path: ${{ runner.temp }}/rust-repository-policy-rules-*.tsv
        if-no-files-found: error
    - name: Prepare coverage-built Rust integration artifact
      # The direct production lane supplies the sole artifact consumed by the
      # focused Python integration job. A benchmark uses a distinct artifact
      # name so its upload cost remains measurable without racing that handoff.
      # Keep the source SHA, checksum, and version beside the executable so the
      # consumer can reject a missing, stale, or altered handoff.
      if: success() && env.COVERAGE_PRODUCES_PYTHON_ARTIFACT == 'true'
      shell: bash
      run: |
        set -euo pipefail
        coverage_larch="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/larch"
        artifact_dir="$RUNNER_TEMP/larch-linux-test-binary"
        test -x "$coverage_larch"
        mkdir -p "$artifact_dir"
        install -m 0755 "$coverage_larch" "$artifact_dir/larch"
        (
          cd "$artifact_dir"
          sha256sum larch > larch.sha256
        )
        printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/source-sha"
        test -n "$RUST_POLICY_INPUTS_SHA256"
        printf '%s\n' "$RUST_POLICY_INPUTS_SHA256" > "$artifact_dir/rust-inputs-sha256"
        printf '%s\n' current-checkout > "$artifact_dir/producer-ref"
        "$artifact_dir/larch" --version > "$artifact_dir/version"
        test -s "$artifact_dir/larch.sha256"
        test -s "$artifact_dir/source-sha"
        test -s "$artifact_dir/rust-inputs-sha256"
        test -s "$artifact_dir/producer-ref"
        test -s "$artifact_dir/version"
    - name: Upload coverage-built Rust executable for cross-language integration tests
      if: success() && env.COVERAGE_PRODUCES_PYTHON_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.COVERAGE_PYTHON_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/larch-linux-test-binary
        if-no-files-found: error
    # Artifacts and correctness checks above are intentionally complete
    # before this cache-only cleanup path. cargo clean removes workspace
    # products while preserving reusable third-party dependency artifacts.
    - name: Prune coverage workspace products before target cache save
      id: coverage-target-cache-prune
      if: success() && env.COVERAGE_TARGET_CACHE_ENABLED == 'true'
      shell: bash
      run: |
        set -euo pipefail
        coverage_target_dir="$GITHUB_WORKSPACE/target/llvm-cov-target"
        test -d "$coverage_target_dir"
        find "$coverage_target_dir" -type f \( \
          -name '*.profraw' -o -name '*.profdata' -o -name '*.lcov' -o \
          -name 'lcov.info' -o -name 'rust-coverage-phases.tsv' \
        \) -delete
        cargo clean --workspace --target-dir "$coverage_target_dir"

        run_specific_file="$(find "$coverage_target_dir" -type f \( \
          -name '*.profraw' -o -name '*.profdata' -o -name '*.lcov' -o \
          -name 'lcov.info' -o -name 'rust-coverage-phases.tsv' \
        \) -print -quit)"
        test -z "$run_specific_file" || {
          printf 'coverage target cache retained run-specific file: %s\n' "$run_specific_file" >&2
          exit 1
        }

        workspace_targets="$RUNNER_TEMP/coverage-target-workspace-targets.txt"
        # Custom build scripts use the generic build_script_build filename,
        # which third-party dependencies also use. cargo clean owns their
        # provenance cleanup; inspect only uniquely named workspace targets.
        cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[].targets[] | select((.kind | index("custom-build")) | not) | .name | gsub("-"; "_")' \
          | LC_ALL=C sort -u > "$workspace_targets"
        while IFS= read -r target_name; do
          # A .d file is compiler dependency metadata, not a produced
          # workspace binary or library.
          stale_workspace_product="$(find "$coverage_target_dir" -type f ! -name '*.d' \( \
            -name "$target_name" -o -name "${target_name}-*" -o \
            -name "lib${target_name}-*" \
          \) -print -quit)"
          test -z "$stale_workspace_product" || {
            printf 'coverage target cache retained workspace product: %s\n' "$stale_workspace_product" >&2
            exit 1
          }
        done < "$workspace_targets"

        cache_size_kib="$(du -sk "$coverage_target_dir" | awk '{print $1}')"
        case "$cache_size_kib" in
          ''|*[!0-9]*) printf 'invalid coverage target cache size: %s\n' "$cache_size_kib" >&2; exit 1 ;;
        esac
        case "$COVERAGE_TARGET_CACHE_MAX_BYTES" in
          ''|*[!0-9]*) printf 'invalid coverage target cache bound: %s\n' "$COVERAGE_TARGET_CACHE_MAX_BYTES" >&2; exit 1 ;;
        esac
        if [ "$COVERAGE_TARGET_CACHE_PUBLICATION" = main-dispatch-benchmark ]; then
          benchmark_max_bytes_cap="${COVERAGE_TARGET_CACHE_MAX_BYTES_CAP:?}"
          case "$benchmark_max_bytes_cap" in
            ''|*[!0-9]*) printf 'invalid coverage target cache benchmark cap: %s\n' "$benchmark_max_bytes_cap" >&2; exit 1 ;;
          esac
          if [ "${#COVERAGE_TARGET_CACHE_MAX_BYTES}" -gt "${#benchmark_max_bytes_cap}" ] \
            || { [ "${#COVERAGE_TARGET_CACHE_MAX_BYTES}" -eq "${#benchmark_max_bytes_cap}" ] && [[ "$COVERAGE_TARGET_CACHE_MAX_BYTES" > "$benchmark_max_bytes_cap" ]]; }; then
            printf 'coverage target cache benchmark bound exceeds cap: %s > %s\n' "$COVERAGE_TARGET_CACHE_MAX_BYTES" "$benchmark_max_bytes_cap" >&2
            exit 1
          fi
        fi
        cache_size_bytes="$((cache_size_kib * 1024))"
        {
          printf 'post-prune-bytes\t%s\n' "$cache_size_bytes"
          printf 'workspace-targets\t%s\n' "$(tr '\n' ',' < "$workspace_targets")"
          printf 'path\n'
          find "$coverage_target_dir" -type f -print | LC_ALL=C sort
        } >> "$COVERAGE_TARGET_CACHE_INVENTORY"
        {
          printf 'COVERAGE_TARGET_CACHE_POST_PRUNE_BYTES=%s\n' "$cache_size_bytes"
          if [ "$COVERAGE_TARGET_CACHE_MAX_BYTES" -eq 0 ]; then
            printf 'COVERAGE_TARGET_CACHE_SAVE_ALLOWED=false\n'
            printf 'COVERAGE_TARGET_CACHE_SAVE_REASON=unmeasured-size-bound\n'
          elif [ "$cache_size_bytes" -gt "$COVERAGE_TARGET_CACHE_MAX_BYTES" ]; then
            printf 'COVERAGE_TARGET_CACHE_SAVE_ALLOWED=false\n'
            printf 'COVERAGE_TARGET_CACHE_SAVE_REASON=size-guard-%s-gt-%s\n' \
              "$cache_size_bytes" "$COVERAGE_TARGET_CACHE_MAX_BYTES"
          else
            printf 'COVERAGE_TARGET_CACHE_SAVE_ALLOWED=true\n'
            printf 'COVERAGE_TARGET_CACHE_SAVE_REASON=within-size-guard\n'
          fi
        } >> "$GITHUB_ENV"
    - name: Record coverage dependency cache prune diagnostics
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          prune_outcome="${{ steps.coverage-target-cache-prune.outcome }}"
          case "$prune_outcome" in
            success) ;;
            failure) ;;
            *) printf 'unexpected coverage target prune outcome: %s\n' "$prune_outcome" >&2; exit 1 ;;
          esac
        else
          prune_outcome=disabled-unmeasured
        fi
        printf 'COVERAGE_TARGET_CACHE_PRUNE_OUTCOME=%s\n' "$prune_outcome" >> "$GITHUB_ENV"
        printf 'coverage-target-cache-prune\t0\t%s\tpost_prune_bytes=%s;save_reason=%s\n' \
          "$prune_outcome" "$COVERAGE_TARGET_CACHE_POST_PRUNE_BYTES" \
          "$COVERAGE_TARGET_CACHE_SAVE_REASON" >> "$COVERAGE_TIMING_FILE"
        printf 'prune-outcome\t%s\n' "$prune_outcome" >> "$COVERAGE_TARGET_CACHE_INVENTORY"
    - name: Upload coverage target cache inventory
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-coverage-target-cache-inventory${{ env.COVERAGE_TIMING_ARTIFACT_SUFFIX }}
        path: ${{ runner.temp }}/coverage-target-cache-inventory.tsv
        if-no-files-found: error
    - name: Start Rust coverage cache save timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        printf 'COVERAGE_CACHE_SAVE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
    - name: Save Cargo inputs
      id: cargo-inputs-save
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-inputs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ steps.cargo-inputs-cache.outputs.cache-primary-key }}
    - name: Save cargo-nextest binary
      id: nextest-cache-save
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nextest-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: ${{ steps.nextest-cache.outputs.cache-primary-key }}
    - name: Save cargo-llvm-cov binary
      id: llvm-cov-cache-save
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.llvm-cov-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: ${{ steps.llvm-cov-cache.outputs.cache-primary-key }}
    - name: Start coverage dependency cache save timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          printf 'COVERAGE_TARGET_CACHE_SAVE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
        else
          printf 'COVERAGE_TARGET_CACHE_SAVE_STARTED=0\n' >> "$GITHUB_ENV"
        fi
    - name: Save coverage dependencies
      id: coverage-target-cache-save
      if: >-
        success() && env.COVERAGE_TARGET_CACHE_ENABLED == 'true' &&
        ((env.COVERAGE_TARGET_CACHE_PUBLICATION == 'main-push' && github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (env.COVERAGE_TARGET_CACHE_PUBLICATION == 'main-dispatch-benchmark' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
        steps.coverage-target-cache.outputs.cache-hit != 'true' && steps.coverage-target-cache-prune.outcome == 'success' &&
        env.COVERAGE_TARGET_CACHE_SAVE_ALLOWED == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: target/llvm-cov-target
        key: ${{ steps.coverage-target-cache.outputs.cache-primary-key }}
    - name: Record coverage dependency cache save diagnostics
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ "$COVERAGE_TARGET_CACHE_ENABLED" = true ]; then
          started="${COVERAGE_TARGET_CACHE_SAVE_STARTED:?}"
          finished="$(date +%s)"
          save_seconds="$((finished - started))"
          save_step_outcome="${{ steps.coverage-target-cache-save.outcome }}"
          case "$save_step_outcome" in
            success) save_outcome=success ;;
            failure) save_outcome=failure ;;
            skipped) save_outcome=skipped ;;
            *) printf 'unexpected coverage target save outcome: %s\n' "$save_step_outcome" >&2; exit 1 ;;
          esac
        else
          save_seconds=0
          save_outcome=disabled-unmeasured
        fi
        {
          printf 'COVERAGE_TARGET_CACHE_SAVE_SECONDS=%s\n' "$save_seconds"
          printf 'COVERAGE_TARGET_CACHE_SAVE_OUTCOME=%s\n' "$save_outcome"
        } >> "$GITHUB_ENV"
        printf 'coverage-target-cache-save\t%s\t%s\tpost_prune_bytes=%s;reason=%s\n' \
          "$save_seconds" "$save_outcome" "$COVERAGE_TARGET_CACHE_POST_PRUNE_BYTES" \
          "$COVERAGE_TARGET_CACHE_SAVE_REASON" >> "$COVERAGE_TIMING_FILE"
    - name: Record Rust coverage cache save timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        started="${COVERAGE_CACHE_SAVE_STARTED:?}"
        finished="$(date +%s)"
        event_name="${{ github.event_name }}"
        ref_name="${{ github.ref }}"
        job_status="${{ job.status }}"
        cache_publication="${COVERAGE_TARGET_CACHE_PUBLICATION:?}"
        cache_hits="cargo-inputs=${{ steps.cargo-inputs-cache.outputs.cache-hit }};cargo-nextest=${{ steps.nextest-cache.outputs.cache-hit }};cargo-llvm-cov=${{ steps.llvm-cov-cache.outputs.cache-hit }}"
        target_cache_hit="${{ steps.coverage-target-cache.outputs.cache-hit }}"
        save_outcomes="cargo-inputs=${{ steps.cargo-inputs-save.outcome }};cargo-nextest=${{ steps.nextest-cache-save.outcome }};cargo-llvm-cov=${{ steps.llvm-cov-cache-save.outcome }};coverage-target=${{ steps.coverage-target-cache-save.outcome }}"
        case "$cache_publication" in
          main-push)
            if [ "$event_name" = workflow_dispatch ]; then
              outcome=skipped
              detail="workflow_dispatch-read-only;${cache_hits}"
            elif [ "$event_name" != push ] || [ "$ref_name" != refs/heads/main ]; then
              outcome=skipped
              detail="pull-request-or-other-read-only;${cache_hits}"
            elif [ "$job_status" != success ]; then
              outcome=skipped
              detail="job-not-success;${cache_hits}"
            elif [ "$cache_hits" = 'cargo-inputs=true;cargo-nextest=true;cargo-llvm-cov=true' ]; then
              outcome=skipped
              detail="all-primary-keys-hit;${cache_hits}"
            elif [[ "$save_outcomes" == *failure* ]]; then
              outcome=failure
              detail="$save_outcomes"
            else
              outcome=success
              detail="$save_outcomes"
            fi
            ;;
          main-dispatch-benchmark)
            if [ "$event_name" != workflow_dispatch ] || [ "$ref_name" != refs/heads/main ]; then
              outcome=skipped
              detail="benchmark-main-dispatch-required;${cache_hits}"
            elif [ "$job_status" != success ]; then
              outcome=skipped
              detail="job-not-success;${cache_hits}"
            elif [[ "$save_outcomes" == *failure* ]]; then
              outcome=failure
              detail="$save_outcomes"
            elif [ "$target_cache_hit" = true ]; then
              outcome=success
              detail="workflow_dispatch-main-benchmark-hit;${cache_hits}"
            elif [ "$COVERAGE_TARGET_CACHE_SAVE_ALLOWED" != true ]; then
              outcome=skipped
              detail="workflow_dispatch-main-benchmark-no-save;reason=${COVERAGE_TARGET_CACHE_SAVE_REASON}"
            elif [ "${{ steps.coverage-target-cache-save.outcome }}" = success ]; then
              outcome=success
              detail="workflow_dispatch-main-benchmark-save;${cache_hits}"
            else
              outcome=failure
              detail="unexpected-benchmark-save-state;${save_outcomes}"
            fi
            ;;
          *)
            printf 'invalid coverage target cache publication: %s\n' "$cache_publication" >&2
            exit 1
            ;;
        esac
        printf 'cache-save\t%s\t%s\t%s\n' "$((finished - started))" "$outcome" "$detail" \
          >> "$COVERAGE_TIMING_FILE"
    - name: Record total Rust coverage job timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        started="${COVERAGE_JOB_TIMING_STARTED:?}"
        finished="$(date +%s)"
        job_outcome="${{ job.status }}"
        printf 'job-total-after-runner-setup\t%s\t%s\tcoverage-cache-policy=%s\n' \
          "$((finished - started))" "$job_outcome" "$COVERAGE_TARGET_CACHE_ENABLED" >> "$COVERAGE_TIMING_FILE"
    - name: Summarize Rust coverage phase timings
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        test -f "$COVERAGE_TIMING_FILE"
        cache_cargo_inputs="${{ steps.cargo-inputs-cache.outputs.cache-hit }}"
        cache_nextest="${{ steps.nextest-cache.outputs.cache-hit }}"
        cache_llvm_cov="${{ steps.llvm-cov-cache.outputs.cache-hit }}"
        {
          printf '## Rust coverage phase timings\n\n'
          printf 'Profile: test opt level %s; configured nextest threads %s; sample %s; benchmark sweep %s.\n\n' \
            "$CARGO_PROFILE_TEST_OPT_LEVEL" "$NEXTEST_TEST_THREADS" "$COVERAGE_PROFILE_SAMPLE" "$COVERAGE_PROFILE_BENCHMARK"
          printf 'Cache hits: Cargo inputs %s; cargo-nextest %s; cargo-llvm-cov %s. This TSV records cache restore, tool setup, profile execution, repository policy, plugin validation, and cache save.\n\n' \
            "$cache_cargo_inputs" "$cache_nextest" "$cache_llvm_cov"
          printf 'Coverage dependency target cache: policy %s; exact hit %s; restore %s s (%s bytes, %s); post-prune %s bytes; save %s s (%s, %s).\n\n' \
            "$COVERAGE_TARGET_CACHE_ENABLED" "$COVERAGE_TARGET_CACHE_HIT" \
            "$COVERAGE_TARGET_CACHE_RESTORE_SECONDS" "$COVERAGE_TARGET_CACHE_RESTORED_BYTES" \
            "$COVERAGE_TARGET_CACHE_RESTORE_OUTCOME" "$COVERAGE_TARGET_CACHE_POST_PRUNE_BYTES" \
            "$COVERAGE_TARGET_CACHE_SAVE_SECONDS" "$COVERAGE_TARGET_CACHE_SAVE_OUTCOME" \
            "$COVERAGE_TARGET_CACHE_SAVE_REASON"
          printf '```tsv\n'
          cat "$COVERAGE_TIMING_FILE"
          printf '```\n'
          shopt -s nullglob
          policy_timing_files=("$RUNNER_TEMP"/rust-repository-policy-rules-*.tsv)
          if [ "${#policy_timing_files[@]}" -gt 0 ]; then
            printf '\n## Rust repository policy rule timings\n\n'
            for policy_timing_file in "${policy_timing_files[@]}"; do
              printf '### %s\n\n' "$(basename "$policy_timing_file" .tsv)"
              printf '```tsv\n'
              cat "$policy_timing_file"
              printf '```\n'
            done
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload Rust coverage phase timings
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-coverage-timings${{ env.COVERAGE_TIMING_ARTIFACT_SUFFIX }}
        path: ${{ runner.temp }}/rust-coverage-phases.tsv
        if-no-files-found: error
