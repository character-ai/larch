# Larch reviewer mode: deny file-writing tools, allow read tools and shell.
#
# Loaded via --admin-policy by scripts/launch-gemini-review.sh so the deny
# rules override --approval-mode yolo's default-allow. Verified
# experimentally in issue #1234: user-tier --policy at priority 999 is
# overridden by yolo; admin-tier at 5999 is not.
#
# Tool-name stability across gemini-cli versions is not officially
# guaranteed. The deny list errs broad. If a future gemini-cli renames a
# write tool or introduces a new one not on this list, the file-write
# block silently no-ops. The health probe's tool-name drift alarm compares
# this deny list with a known catalog fixture and best-effort live discovery.
# The companion launcher test harness pins argv shape but does not exercise
# live gemini behavior. Keep the single-line toolName array shape: the drift
# parser treats this exact shape as its v1 contract.
#
# --admin-policy is documented as "OS-specific system directories" in
# gemini-cli, but `gemini --help` advertises it as a normal CLI flag
# accepting "files or directories", and experiments confirmed it loads
# arbitrary paths. This is a slightly off-label use; if a future
# gemini-cli version restricts admin-policy to system paths only, the
# fix breaks gracefully (yolo still works, just unhardened).
[[rule]]
toolName = ["write_file", "replace", "edit", "edit_file", "delete_file"]
decision = "deny"
priority = 5999
denyMessage = "Larch reviewer mode: write tools are disabled. The reviewer prompt is read-only."
