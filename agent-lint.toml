[lint]
suppress = [
  "body-too-long",
  "script-deps-missing",
  "body-no-default",
  "mcp-tool-unqualified",
  "desc-body-misalign",
  "terminology-inconsistent",
  # nested-ref-deep is suppressed because the anti-halt continuation banner
  # (closes #177) requires every orchestrator SKILL.md to cite
  # skills/shared/subskill-invocation.md as the canonical source of the
  # rule. subskill-invocation.md itself contains many inline SKILL.md
  # example references (which the S029 rule counts as "nested"), but the
  # banner carries the operative one-sentence rule inline — the canonical
  # reference is a discoverability aid, not a mandatory cross-ref chain.
  # The rule's stated concern ("humans/LLMs chasing chained refs") does not
  # apply to this use case. See `skills/shared/subskill-invocation.md`
  # (normative home of the anti-halt banner convention).
  "nested-ref-deep",
  # template-count-mismatch is suppressed because the specialist reviewer
  # agents (agents/reviewer-{structure,correctness,testing,security,edge-cases}.md)
  # are hand-authored specialist variants derived from the shared Code Reviewer
  # archetype but maintained independently — they do NOT each have a matching
  # `## Reviewer` section in skills/shared/reviewer-templates.md. The shared
  # template defines the generic archetype (1 section); the specialists narrow
  # it to focus areas. CI's focus-area enum check covers drift prevention.
  "template-count-mismatch",
  # tools-unknown (S040) is suppressed because agent-lint 2.3.2's built-in
  # tool registry predates the `Monitor` tool (introduced in Claude Code
  # after the agent-lint release shipped). `Monitor` is a first-party
  # Claude Code tool used by loop-driver SKILL.md files for passive
  # log-tailing observability. Suppression is global because agent-lint
  # 2.3.2 does not support per-file or per-token exceptions for this rule.
  # Revisit when agent-lint is upgraded — once the registry includes
  # Monitor, remove this entry.
  "tools-unknown",
  # template-marker-missing (A006) requires every agent file to carry the
  # 'Derived from skills/shared/reviewer-templates.md' marker. That marker
  # is meaningful for the Code Reviewer archetype family (code-reviewer.md
  # and the reviewer-*.md specialists), but agents/codex-implementer.md,
  # agents/cursor-implementer.md, and agents/gemini-implementer.md are
  # NON-reviewer agents — system-prompt bodies loaded by the Step 2
  # implementer launchers, not review/synthesis agents.
  # Suppression is global because agent-lint does not support per-file
  # exceptions for this rule. Drift defense for the reviewer family lives
  # in the registry walker (scripts/check-generators.sh, which dispatches
  # scripts/generate-code-reviewer-agent.sh --check via scripts/generators.tsv)
  # + the existing CI pin on the focus-area enum.
  "template-marker-missing",
]

# scripts/test-sessionstart-health.sh is the regression test for the
# SessionStart hook (scripts/sessionstart-health.sh). It is a plugin-level
# infrastructure test — not owned by any SKILL.md — and is invoked via
# `make lint` (test-sessionstart target). Agent-lint's dead-script rule
# only recognizes structured references from SKILL.md/hooks.json/ci.yaml,
# so we exclude the test path explicitly.
#
# scripts/audit-edit-write.sh and scripts/test-audit-edit-write.sh are the
# dev-only opt-in PostToolUse audit hook pair — structurally referenced from
# Makefile (test target), docs/dev-hook-audit.md (enable snippet),
# scripts/audit-edit-write.md (sibling contract), and SECURITY.md, but NOT
# from hooks/hooks.json or .claude/settings.json by design (issue #155:
# contributors opt in locally via gitignored .claude/settings.local.json).
# agent-lint's G004/dead-script rule only scans SKILL.md / CLAUDE.md /
# hooks.json / settings.json for invocation refs and does not follow CLAUDE.md
# @-imports or Makefile targets, so these two scripts would be false-flagged.
# Excluded here rather than force-registered to preserve the dev-only opt-in
# contract.
#
# scripts/test-deny-edit-write.sh is the regression harness for
# scripts/deny-edit-write.sh (the skill-scoped PreToolUse deny hook for
# /research). The hook script itself IS structurally referenced from
# skills/research/SKILL.md's hooks: frontmatter and is therefore not
# excluded; the test script is referenced only from Makefile, matching the
# same Makefile-only pattern as the test-sessionstart-health.sh entry above.
#
# scripts/test-post-scaffold-hints.sh is the regression harness for
# skills/create-skill/scripts/post-scaffold-hints.sh (the post-scaffold
# reminder emitter invoked by /create-skill). The hints script itself IS
# structurally referenced from skills/create-skill/SKILL.md Step 3 and is
# therefore not excluded; the test script is referenced only from Makefile
# (test-post-scaffold-hints target) and
# skills/create-skill/scripts/post-scaffold-hints.md (sibling contract),
# matching the same Makefile-only pattern as the test-deny-edit-write.sh
# entry above.
#
# skills/create-skill/scripts/test-render-skill-md.sh is the regression
# harness for render-skill-md.sh (the scaffold generator). The generator
# itself IS structurally referenced from skills/create-skill/SKILL.md's
# Step 3 feature-description template and is therefore not excluded; the
# test script is referenced only from Makefile's test-render-skill target,
# matching the same Makefile-only pattern as the entries above.
#
# scripts/lib-count-commits.sh is a sourced-only shell library (no shebang,
# not invokable directly). It is referenced from scripts/check-bump-version.sh
# and scripts/verify-skill-called.sh via `source` directives only — agent-lint
# does not follow `source` directives in sibling scripts, so the library
# would be false-flagged as dead. scripts/test-verify-skill-called.sh is the
# regression harness for scripts/verify-skill-called.sh and is referenced
# only from Makefile, matching the same Makefile-only pattern as the other
# test-* harnesses above. Both are documented in scripts/verify-skill-called.md
# (sibling contract).
#
# scripts/test-check-bump-version.sh is the regression harness for
# scripts/check-bump-version.sh (#172). It is referenced only from Makefile
# (test-check-bump-version target) and scripts/check-bump-version.md
# (sibling contract), matching the same Makefile-only pattern as the other
# test-* harnesses above.
#
# scripts/lib-gemini-tool-drift.sh is a sourced-only shell library (no shebang,
# not invokable directly). It is referenced from scripts/check-reviewers.sh via
# a `source` directive only, which agent-lint does not follow.
#
# scripts/test-lint-skill-invocations.sh is the regression harness for
# scripts/lint-skill-invocations.py (the skill-invocation documentation lint).
# The lint script itself IS structurally referenced from .pre-commit-config.yaml
# (local hook `lint-skill-invocations`) and is therefore not excluded; the test
# harness is referenced only from Makefile (test-lint-skill-invocations target)
# and scripts/lint-skill-invocations.md (sibling contract), matching the same
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-lint-literal-counts.sh is the regression harness for
# scripts/lint-literal-counts.py (the drift-prone literal item-count markdown
# lint). The lint script itself IS structurally referenced from
# .pre-commit-config.yaml (local hook `lint-literal-counts`) and is therefore
# not excluded; the test harness is referenced only from Makefile
# (test-lint-literal-counts target) and scripts/lint-literal-counts.md
# (sibling contract), matching the same Makefile-only pattern as the other
# test-* harnesses above.
#
# skills/fix-issue/scripts/test-parse-prose-blockers.sh is the regression
# harness for skills/fix-issue/scripts/parse-prose-blockers.sh (the prose-
# dependency parser invoked by skills/fix-issue/scripts/blocker-helpers.sh's
# prose_open_blockers function — sourced by both find-lock-issue.sh and
# umbrella-handler.sh per issue #768).
# The parser itself IS structurally referenced from skills/fix-issue/SKILL.md's
# Step 0 (find / eligibility / dependencies / lock / rename) description and from blocker-helpers.sh's
# prose_open_blockers function, and is therefore not excluded; the test
# harness is referenced only from Makefile (test-parse-prose-blockers target)
# and skills/fix-issue/scripts/parse-prose-blockers.md (sibling contract),
# matching the same Makefile-only pattern as the other test-* harnesses above.
#
# skills/fix-issue/scripts/blocker-helpers.sh is the shared blocker-resolution
# library introduced by issue #768 — owns native_open_blockers,
# prose_open_blockers, and all_open_blockers, sourced by both find-lock-issue.sh
# and umbrella-handler.sh. Same "sourced library" shape as scripts/lib-count-commits.sh
# above: no shebang dependence, referenced only via `source` directives, which
# agent-lint does not follow. Excluded with its sibling .md (skills/fix-issue/
# scripts/blocker-helpers.md, in the .md exclude block at the bottom of this file).
#
# skills/fix-issue/scripts/test-issue-lifecycle.sh is the regression harness
# for skills/fix-issue/scripts/issue-lifecycle.sh close idempotency (Phase 2
# of umbrella #348). The target script IS structurally referenced from
# skills/fix-issue/SKILL.md's Step 0 (via find-lock-issue.sh delegation), Step 3
# (close for not-material), and Step 6 (close for DONE), and is therefore not
# excluded; the test harness is referenced only from Makefile
# (test-issue-lifecycle target) and skills/fix-issue/scripts/issue-lifecycle.md
# (sibling contract), matching the same Makefile-only pattern as the other
# test-* harnesses above.
#
# skills/fix-issue/scripts/test-fix-issue-bail-detection.sh is the regression
# harness pinning six load-bearing literals (five conceptual checks;
# `--issue $ISSUE_NUMBER` counted once per SIMPLE and HARD bullet) in
# skills/fix-issue/SKILL.md Step 5a bail-detection prose (Phase 4 of umbrella
# #348; renumbered from Step 6a by the fold-find-and-lock refactor closes
# #496): `--issue $ISSUE_NUMBER` forwarding in both SIMPLE and HARD bullets,
# the cross-skill bail token `IMPLEMENT_BAIL_REASON=adopted-issue-closed`,
# the user-visible warning prefix `/implement bailed: issue #`, the specific
# `Do NOT call `issue-lifecycle.sh close`` directive (full phrase, not a
# bare `Do NOT call` substring — the bare form would false-pass on section
# 5b's unrelated `Do NOT call `/implement`` line), and the `Skip to Step 8`
# cleanup redirect — both directive pins guard against silent re-routing of
# the bail path back to Step 6. The harness is referenced only from Makefile
# (test-fix-issue-bail-detection target) and
# skills/fix-issue/scripts/test-fix-issue-bail-detection.md (sibling
# contract), matching the same Makefile-only pattern as the other test-*
# harnesses above. Both the .sh and the .md are excluded below.
#
# skills/fix-issue/scripts/test-fix-issue-step-order.sh is the regression
# harness pinning the Step 0 = find & lock, Step 1 = setup ordering
# established by the fold-find-and-lock refactor (closes #496; previously
# pinned the pre-fold Step 1 = lock + Step 2 = setup ordering from PR #468
# closing #445). Twelve assertions over skills/fix-issue/SKILL.md cover Step
# Name Registry rows, section headings, anti-pattern #1 wording, and find &
# lock breadcrumb literals (positive matches on `0: find & lock`, negative
# matches on stale `1: lock` / `2: lock`). The harness is referenced only
# from Makefile (test-fix-issue-step-order target) and
# skills/fix-issue/scripts/test-fix-issue-step-order.md (sibling contract),
# matching the same Makefile-only pattern as the other test-* harnesses
# above. Both the .sh and the .md are excluded below.
#
# skills/fix-issue/scripts/test-find-lock-issue.sh is the offline regression
# harness for skills/fix-issue/scripts/find-lock-issue.sh (the combined Find
# + Lock + Rename pipeline introduced by the fold-find-and-lock refactor
# closes #496). It uses a PATH-prepended `gh` stub under a per-fixture tmpdir
# to validate the script's exit-code matrix (0/1/2/3/4/5) and unified stdout
# contract (ELIGIBLE / ISSUE_NUMBER / ISSUE_TITLE / LOCK_ACQUIRED / RENAMED /
# ERROR + umbrella keys IS_UMBRELLA / UMBRELLA_NUMBER / UMBRELLA_TITLE /
# UMBRELLA_ACTION) without any network or git-state mutation. Six pre-umbrella
# fixtures (ok, lock-fail, rename-fail-best-effort, idempotent-deferred,
# ineligible, no-eligible-candidates) plus umbrella fixtures (explicit-
# umbrella-dispatched, all-closed-finalize, no-eligible-child, child-lock-
# failure, auto-pick-skips-umbrella, umbrella-number-absent-on-non-umbrella).
# The harness is referenced only from Makefile (test-find-lock-issue target)
# and skills/fix-issue/scripts/test-find-lock-issue.md (sibling contract),
# matching the same Makefile-only pattern as the other test-* harnesses
# above. Both the .sh and the .md are excluded below.
#
# skills/fix-issue/scripts/test-umbrella-handler.sh is the offline regression
# harness for skills/fix-issue/scripts/umbrella-handler.sh (umbrella detection
# + child enumeration + pick-child for /fix-issue's umbrella support). PATH-
# prepended `gh` stub. Fixtures cover detection priority (body-primary vs
# title-fallback per FINDING_13), task-list grammar boundaries (cross-repo
# rejection, self-reference filter, prose-only-no-task-list rejection), pick-
# child eligibility branches (eligible / locked / managed-prefix / closed),
# the all-closed terminal state, and FINDING_3's zero-children-is-not-
# ALL_CLOSED invariant. Referenced only from Makefile (test-umbrella-handler
# target) and skills/fix-issue/scripts/test-umbrella-handler.md (sibling
# contract). Both the .sh and the .md are excluded below.
#
# skills/fix-issue/scripts/test-finalize-umbrella.sh is the offline regression
# harness for skills/fix-issue/scripts/finalize-umbrella.sh (the umbrella-
# finalize composer used by /fix-issue Step 0 exit-4 path and the Step 3 / 5a
# / 6 finalize hooks). PATH-prepended `gh` stub. Fixtures cover finalize-
# success, finalize-idempotent-when-marker-comment-exists (FINDING_2),
# finalize-idempotent-when-already-DONE-prefix, finalize-idempotent-when-
# already-CLOSED, rename-failed-but-close-success (best-effort rename
# invariant). Referenced only from Makefile (test-finalize-umbrella target)
# and skills/fix-issue/scripts/test-finalize-umbrella.md (sibling contract).
# Both the .sh and the .md are excluded below.
#
# skills/set-up-forked-open-source-repo/scripts/test-setup-forked-open-source-repo.sh
# is the offline regression harness for the public fork-setup coordinator. It
# creates local bare upstream/fork repositories, stubs `gh`, and is referenced
