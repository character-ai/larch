[lint]
suppress = [
  "body-too-long",
  "script-deps-missing",
  "body-no-default",
  "mcp-tool-unqualified",
  "desc-body-misalign",
  "terminology-inconsistent",
  # nested-ref-deep is suppressed because the anti-halt continuation banner
  # (closes #177) requires every orchestrator SKILL.md to cite
  # skills/shared/subskill-invocation.md as the canonical source of the
  # rule. subskill-invocation.md itself contains many inline SKILL.md
  # example references (which the S029 rule counts as "nested"), but the
  # banner carries the operative one-sentence rule inline — the canonical
  # reference is a discoverability aid, not a mandatory cross-ref chain.
  # The rule's stated concern ("humans/LLMs chasing chained refs") does not
  # apply to this use case. See `skills/shared/subskill-invocation.md`
  # (normative home of the anti-halt banner convention).
  "nested-ref-deep",
  # template-count-mismatch is suppressed because the specialist reviewer
  # agents (agents/reviewer-{structure,correctness,testing,security,edge-cases}.md)
  # are hand-authored specialist variants derived from the shared Code Reviewer
  # archetype but maintained independently — they do NOT each have a matching
  # `## Reviewer` section in skills/shared/reviewer-templates.md. The shared
  # template defines the generic archetype (1 section); the specialists narrow
  # it to focus areas. CI's focus-area enum check covers drift prevention.
  "template-count-mismatch",
  # tools-unknown (S040) is suppressed because agent-lint 2.3.2's built-in
  # tool registry predates the `Monitor` tool (introduced in Claude Code
  # after the agent-lint release shipped). `Monitor` is a first-party
  # Claude Code tool used by loop-driver SKILL.md files for passive
  # log-tailing observability. Suppression is global because agent-lint
  # 2.3.2 does not support per-file or per-token exceptions for this rule.
  # Revisit when agent-lint is upgraded — once the registry includes
  # Monitor, remove this entry.
  "tools-unknown",
  # template-marker-missing (A006) requires every agent file to carry the
  # 'Derived from skills/shared/reviewer-templates.md' marker. That marker
  # is meaningful for the Code Reviewer archetype family (code-reviewer.md
  # and the reviewer-*.md specialists), but agents/codex-implementer.md,
  # and agents/cursor-implementer.md are
  # NON-reviewer agents — system-prompt bodies loaded by the Step 2
  # implementer launchers, not review/synthesis agents.
  # Suppression is global because agent-lint does not support per-file
  # exceptions for this rule. Drift defense for the reviewer family lives
  # in the registry walker (scripts/check-generators.sh, which dispatches
  # scripts/generate-code-reviewer-agent.sh --check via scripts/generators.tsv)
  # + the existing CI pin on the focus-area enum.
  "template-marker-missing",
]

# scripts/test-sessionstart-health.sh is the regression test for the
# SessionStart hook (scripts/sessionstart-health.sh). It is a plugin-level
# infrastructure test — not owned by any SKILL.md — and is invoked via
# `make lint` (test-sessionstart target). Agent-lint's dead-script rule
# only recognizes structured references from SKILL.md/hooks.json/ci.yaml,
# so we exclude the test path explicitly.
#
# scripts/audit-edit-write.sh and scripts/test-audit-edit-write.sh are the
# dev-only opt-in PostToolUse audit hook pair — structurally referenced from
# Makefile (test target), docs/dev-hook-audit.md (enable snippet),
# scripts/audit-edit-write.md (sibling contract), and SECURITY.md, but NOT
# from hooks/hooks.json or .claude/settings.json by design (issue #155:
# contributors opt in locally via gitignored .claude/settings.local.json).
# agent-lint's G004/dead-script rule only scans SKILL.md / CLAUDE.md /
# hooks.json / settings.json for invocation refs and does not follow CLAUDE.md
# @-imports or Makefile targets, so these two scripts would be false-flagged.
# Excluded here rather than force-registered to preserve the dev-only opt-in
# contract.
#
# scripts/test-deny-edit-write.sh is the regression harness for
# scripts/deny-edit-write.sh (the skill-scoped PreToolUse deny hook for
# /research). The hook script itself IS structurally referenced from
# skills/research/SKILL.md's hooks: frontmatter and is therefore not
# excluded; the test script is referenced only from Makefile, matching the
# same Makefile-only pattern as the test-sessionstart-health.sh entry above.
#
# scripts/lib-count-commits.sh is a sourced-only shell library (no shebang,
# not invokable directly). It is referenced from scripts/verify-skill-called.sh
# via a `source` directive only — agent-lint does not follow `source`
# directives in sibling scripts, so the library would be false-flagged as
# dead. scripts/test-verify-skill-called.sh is the regression harness for
# scripts/verify-skill-called.sh and is referenced only from Makefile,
# matching the same Makefile-only pattern as the other test-* harnesses above.
# Both are documented in scripts/verify-skill-called.md (sibling contract).
#
# scripts/test-lint-skill-invocations.sh is the regression harness for
# scripts/lint-skill-invocations.py (the skill-invocation documentation lint).
# The lint script itself IS structurally referenced from .pre-commit-config.yaml
# (local hook `lint-skill-invocations`) and is therefore not excluded; the test
# harness is referenced only from Makefile (test-lint-skill-invocations target)
# and scripts/lint-skill-invocations.md (sibling contract), matching the same
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-lint-literal-counts.sh is the regression harness for
# scripts/lint-literal-counts.py (the drift-prone literal item-count markdown
# lint). The lint script itself IS structurally referenced from
# .pre-commit-config.yaml (local hook `lint-literal-counts`) and is therefore
# not excluded; the test harness is referenced only from Makefile
# (test-lint-literal-counts target) and scripts/lint-literal-counts.md
# (sibling contract), matching the same Makefile-only pattern as the other
# test-* harnesses above.
#
# scripts/test-lint-no-raw-stderr-after-quiet-init.sh is the regression harness
# for scripts/lint-no-raw-stderr-after-quiet-init.py (S041/no-raw-stderr-after-
# quiet-init). The lint script itself is structurally referenced from
# .pre-commit-config.yaml (local hook
# `lint-no-raw-stderr-after-quiet-init`) and is therefore not excluded; the test
# harness is referenced only from Makefile
# (test-lint-no-raw-stderr-after-quiet-init target) and its sibling contract.
#
# scripts/lint-bash32.sh is the Bash 3.2 portability linter wired directly into
# Makefile (`lint-bash32` and local `lint`). scripts/test-lint-bash32.sh is its
# black-box regression harness. Both are Makefile-only from agent-lint's
# reachability perspective, so both are excluded with their sibling contracts.
#
# scripts/lint-readability-preamble.sh is a pre-commit / Makefile-only lint for
# /design readability prompt registrations. scripts/test-lint-readability-preamble.sh
# is its black-box harness. Both are excluded with sibling docs because agent-lint
# does not treat pre-commit or Makefile wiring as structured runtime invocation.
#
# scripts/lint-renderer-substitution-safety.sh and
# scripts/lint-skill-md-flag-signature.sh are pre-commit / Makefile-only lints,
# and their `test-*` companions are black-box harnesses. Exclude them with their
# sibling contracts like the adjacent lint harnesses.
#
# scripts/lint-gh-body-inline.sh is a pre-commit / Makefile-only lint for
# file-backed GitHub CLI body payloads. scripts/test-lint-gh-body-inline.sh is
# its black-box harness. Same reachability pattern as lint-readability-preamble.
#
# scripts/lint-bare-grep-probe.sh is a pre-commit / Makefile-only lint that
# rejects bare top-level grep probes in orchestrator-facing markdown fences
# (closes #3104). scripts/test-lint-bare-grep-probe.sh is its black-box
# harness. Same reachability pattern as the other lint family above.
#
# scripts/lint-awk-multibyte-regex.sh is a pre-commit / Makefile-only lint for
# non-ASCII bytes inside dynamic awk regex contexts (closes #3134).
# scripts/test-lint-awk-multibyte-regex.sh is its black-box harness.
#
# scripts/test-parse-prose-blockers.sh is the regression harness for
# scripts/parse-prose-blockers.sh (Makefile `test-parse-prose-blockers`).
# scripts/parse-prose-blockers.sh is invoked only from scripts/blocker-helpers.sh
# (dynamic `$(dirname …)/parse-prose-blockers.sh`); agent-lint does not follow
# `source`, so it is dead-script excluded alongside the harness.
# scripts/blocker-helpers.sh is sourced by scripts/implement-admission.sh; agent-lint
# does not follow `source`, so the library + sibling `scripts/blocker-helpers.md` are
# dead-script excluded. scripts/test-implement-admission.sh is the admission matrix
# harness (Makefile `test-implement-admission`).
#
# skills/set-up-forked-open-source-repo/scripts/test-setup-forked-open-source-repo.sh
# is the offline regression harness for the public fork-setup coordinator. It
# creates local bare upstream/fork repositories, stubs `gh`, and is referenced
# only from Makefile (test-set-up-forked-open-source-repo target) plus the
# coordinator sibling contract, matching the same Makefile-only harness pattern
# as the skill-local test harnesses above. lib-remotes.sh is a sourced-only
# helper referenced by the coordinator via `source`, which agent-lint does not
# follow. Both sibling .md files are excluded below.
#
# scripts/test-anti-halt-banners.sh is the regression harness for the
# anti-halt continuation banner (closes #177). The harness asserts banner
# presence in four orchestrator SKILL.md files (implement, review,
# alias, research) and absence in two pure-delegator SKILL.md files (im, imaq).
# It is structurally referenced from Makefile (test-anti-halt target) and
# skills/shared/subskill-invocation.md (normative scope-list source),
# matching the same Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-anti-improvised-wakeup.sh is the regression harness for the
# project-wide guard against improvised ScheduleWakeup calls outside
# skill-script direction. It is structurally referenced from Makefile
# (test-anti-improvised-wakeup target) and
# scripts/test-anti-improvised-wakeup.md (sibling contract), matching the
# same Makefile-only pattern as the other test-* harnesses above. Both the
# .sh and the .md are excluded below.
#
# scripts/test-subskill-anchors.sh is the regression harness for every
# `<path>/SKILL.md § <heading>` citation in skills/shared/subskill-invocation.md
# (closes #236). The harness enforces heading-anchor resolution against the
# referenced SKILL.md files — a contract orthogonal to the invocation-wording
# contract enforced by scripts/lint-skill-invocations.py. It is referenced
# only from Makefile (test-subskill-anchors target) and
# scripts/test-subskill-anchors.md (sibling contract), matching the same
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-implement-structure.sh is the structural regression harness
# for skills/implement/SKILL.md and skills/implement/references/ invariants
# (closes #234). Companion to scripts/test-implement-rebase-macro.sh: the
# macro harness owns Rebase Checkpoint Macro placement/registry mechanics,
# this harness owns top-level section headings (Load-Bearing Invariants /
# NEVER List / Rebase Checkpoint Macro), the MANDATORY ↔ reference-file
# binding, the CI-parity focus-area enum check, and the no-`see Step N
# below|above` invariant in references/*.md. The cross-skill Consumer/
# Contract/When-to-load header-triplet invariant moved out of this harness
# as of #308 — see scripts/test-references-headers.sh below. It is
# referenced only from Makefile (test-implement-structure target) and
# scripts/test-implement-structure.md (sibling contract), matching the
# same Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-references-headers.sh is the cross-skill structural
# regression guard for the progressive-disclosure reference header triplet
# (closes #308). Scans every skills/*/references/*.md (flat glob, no
# nested references/** descent) and asserts each file contains the
# **Consumer**:, **Contract**:, and **When to load**: headers matched as
# anchored line-start patterns (to avoid false-passes on prose or fenced-
# code examples). Owns the triplet invariant formerly held by
# test-implement-structure.sh assertion (8). Companion to
# test-implement-structure.sh (/implement-specific topology) and
# test-research-structure.sh (stricter /research-local first-20-lines
# tightening layered on top of this global presence check). Referenced
# only from Makefile (test-references-headers target) and
# scripts/test-references-headers.md (sibling contract), matching the
# same Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-orchestrator-scope-sync.sh is the cross-validation harness
# (closes #285) that asserts exact set equality between the ORCHESTRATORS /
# DELEGATORS arrays in scripts/test-anti-halt-banners.sh and the bulleted
# scope lists under "### Scope list" in skills/shared/subskill-invocation.md.
# Referenced only from Makefile (test-orchestrator-scope-sync target) and
# scripts/test-orchestrator-scope-sync.md (sibling contract); matches the
# Makefile-only pattern as the other harnesses above.
#
# scripts/test-quick-mode-docs-sync.sh is the cross-validation harness
# (closes #370) that asserts the public /implement --quick description in
# README.md, docs/review-agents.md, and docs/workflow-lifecycle.md stays
# aligned with the normative contract in skills/implement/SKILL.md Step 5
# (up to 7 rounds, Cursor → Codex → Claude fallback chain, no voting panel).
# Also pins the literal `--design-only` substring in README.md, docs/skills.md,
# docs/workflow-lifecycle.md, and skills/implement/SKILL.md so flag rename or
# removal in any of those four files is caught at the source (Round 2 #984 / FINDING_H).
# Referenced only from Makefile (test-quick-mode-docs-sync target) and
# scripts/test-quick-mode-docs-sync.md (sibling contract); matches the
# Makefile-only pattern as the other harnesses above.
#
# scripts/test-implement-step2-routing.sh is the structural regression harness
# for /implement Step 2 omitted-coder routing and /design diff-lines export.
# Referenced only from Makefile
# (test-implement-step2-routing target) and
# scripts/test-implement-step2-routing.md (sibling contract); matches the
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-research-structure.sh is the structural regression harness
# for skills/research/SKILL.md and skills/research/references/ invariants
# (2-reference progressive-disclosure topology introduced by the /research
# refactor). Companion to scripts/test-design-structure.sh and
# scripts/test-implement-structure.sh: this harness owns the /research
# MANDATORY ↔ reference-file binding (research-phase.md, validation-phase.md),
# the reciprocal "Do NOT load" guards on each MANDATORY line, the
# Consumer/Contract/When-to-load reference header triplet, the
# RESEARCH_PROMPT_BASELINE byte pin (post-#508 rename of RESEARCH_PROMPT;
# the same `grep -F "RESEARCH_PROMPT"` substring also matches the four angle
# prompt names ARCH/EDGE/EXT/SEC), and the validation XML wrapper tag pins. It is
# referenced only from Makefile (test-research-structure target) and
# scripts/test-research-structure.md (sibling contract), matching the same
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-review-structure.sh is the structural regression harness for
# skills/review/SKILL.md and skills/review/references/ invariants (closes
# #306). Companion to scripts/test-design-structure.sh,
# scripts/test-implement-structure.sh, and scripts/test-research-structure.sh:
# this harness owns the /review MANDATORY ↔ reference-file binding
# (bidirectional orphan detection via filesystem enumeration; baseline pair
# domain-rules.md and voting.md), the CI-parity focus-area enum check
# mirroring the agent-sync UNQUOTED_FILES loop, the anti-halt banner and
# micro-reminder substring pins (intentional overlap with
# scripts/test-anti-halt-banners.sh for single-file fail locality, matching
# the test-implement-structure.sh precedent), and the /review native
# 2-line reference header schema (**Consumer**: and **Binding convention**:
# in the first 20 lines — deliberately NOT the /implement
# Consumer/Contract/When-to-load triplet). It is referenced only from
# Makefile (test-review-structure target) and
# scripts/test-review-structure.md (sibling contract), matching the same
# Makefile-only pattern as the other test-* harnesses above.
#
# scripts/test-render-reviewer-prompt.sh is the regression harness for
# scripts/render-reviewer-prompt.sh (closes #417 — alignment of /research
# Codex+Cursor validation lanes with the unified code-reviewer archetype).
# The renderer itself is structurally referenced from skills/research/
# references/validation-phase.md (loaded via MANDATORY directive from
# skills/research/SKILL.md) and is therefore not excluded; the test harness
# is referenced only from Makefile (test-render-reviewer-prompt target) and
# scripts/test-render-reviewer-prompt.md (sibling contract), matching the
# same Makefile-only pattern as the other test-* harnesses above.
#
# scripts/eval-research.sh is the opt-in /research evaluation harness
# (closes #419 under umbrella #413). Referenced only from Makefile
# (eval-research target — NOT a lint prerequisite) and
# scripts/eval-research.md (sibling contract); matches the same
# Makefile-only pattern as the test-* harnesses.
# scripts/test-eval-set-structure.sh is the offline structural regression
# harness for the eval set + harness; referenced only from Makefile
# (test-eval-set-structure standalone target — also NOT a lint prerequisite,
# mirroring the runtime harness's opt-in shape) and
# scripts/test-eval-set-structure.md (sibling contract).
exclude = [
  # larch-log-flush.sh is invoked by the Step 2 dispatcher through
  # "$PLUGIN_ROOT/scripts/larch-log-flush.sh"; agent-lint's dead-script rule
  # does not follow Bash-to-Bash variable-expanded caller edges.
  "scripts/larch-log-flush.sh",
  "scripts/larch-log-flush.md",
  # larch-log migration harnesses are Makefile/pre-commit only. They are not
  # invoked from skill prose at runtime, so dead-script reachability is a false
  # positive for these test entrypoints.
  "scripts/test-larch-log.sh",
  "scripts/test-larch-log.md",
  "scripts/test-capture-session-transcript.sh",
  "scripts/test-capture-session-transcript.md",
  # scripts/verify-run-log-completeness.sh is the run-log completeness checker wired into
  # Makefile (test-verify-run-log-completeness target and make lint via test-harnesses-7).
  # scripts/test-verify-run-log-completeness.sh is its regression harness. Neither is
  # invoked from SKILL.md/hooks.json/ci.yaml directly; agent-lint's G004/dead-script rule
  # does not follow Makefile target chains. Same Makefile-only pattern as
  # test-capture-session-transcript.sh above.
  "scripts/verify-run-log-completeness.sh",
  "scripts/verify-run-log-completeness.md",
  "scripts/test-verify-run-log-completeness.sh",
  "scripts/test-verify-run-log-completeness.md",
  "scripts/test-local-cleanup.sh",
  "scripts/test-local-cleanup.md",
  "scripts/test-larch-logs-manifest.sh",
  "scripts/test-larch-logs-manifest.md",
  "scripts/test-larch-logs-batches.sh",
  "scripts/test-larch-logs-batches.md",
  "scripts/test-larch-log-write-round.sh",
  "scripts/test-larch-log-write-round.md",
  # scripts/test-scrub-log-secrets.sh is the Makefile-only regression harness for
  # scripts/scrub-log-secrets.sh (the pre-flush secret gate). The gate itself is
  # reached via "$SCRIPT_DIR/scrub-log-secrets.sh" from larch-log.sh /
  # design-log-publish.sh and is not flagged; the harness is referenced only from
  # Makefile (test-scrub-log-secrets target) and its sibling contract, matching
  # the same Makefile-only pattern as the other run-log test-* harnesses above.
  "scripts/test-scrub-log-secrets.sh",
  "scripts/test-scrub-log-secrets.md",
  # Step 1 launcher split: compose-plan-goals-test.sh is now invoked by
  # scripts/run-step1-plan-log.sh rather than directly from SKILL.md, and
  # agent-lint does not follow Bash-to-Bash launcher edges. The launcher
  # harness is Makefile-only.
  "scripts/compose-plan-goals-test.sh",
  "scripts/compose-plan-goals-test.md",
  "scripts/test-compose-plan-goals-test.sh",
  "scripts/test-compose-plan-goals-test.md",
  "scripts/test-run-step1-plan-log.sh",
  "scripts/test-run-step1-plan-log.md",
  # Step 5 launcher harness is Makefile-only; runtime reachability is through
  # the SKILL.md invocation of scripts/run-step5-review.sh.
  "scripts/test-run-step5-review.sh",
  "scripts/test-run-step5-review.md",
  # Makefile/ship-pr-only CI recovery helpers. ci-failed-jobs.sh is invoked
  # by scripts/ship-pr.sh after gh-run-logs succeeds; check-focus-area-enum.sh
  # is invoked by the Makefile's agent-sync target, which mirrors the CI job.
  # Their harnesses are Makefile-only, so G004 cannot discover the edges.
  "scripts/ci-failed-jobs.sh",
  "scripts/ci-failed-jobs.md",
  "scripts/test-ci-failed-jobs.sh",
  "scripts/test-ci-failed-jobs.md",
  "scripts/check-focus-area-enum.sh",
  "scripts/check-focus-area-enum.md",
  # scripts/test-compose-collector-failure-log.sh is the Makefile-only
  # regression harness for scripts/compose-collector-failure-log.sh. The
  # helper is invoked from /design sketch collection paths; the harness is
  # covered by the test-compose-collector-failure-log target.
  "scripts/test-compose-collector-failure-log.sh",
  "scripts/test-compose-collector-failure-log.md",
  "scripts/test-tracking-issue-summary.sh",
  "scripts/test-tracking-issue-summary.md",
  "scripts/test-compose-review-findings.sh",
  "scripts/test-compose-review-findings.md",
  # scripts/test-append-tool-failure.sh is the Makefile-only regression
  # harness for scripts/append-tool-failure.sh. The helper itself is
  # runtime-referenced from /implement, /design, /review, and ship-pr.sh;
  # the harness is covered by the test-append-tool-failure target.
  "scripts/test-append-tool-failure.sh",
  "scripts/test-append-tool-failure.md",
  # scripts/test-degraded-tools-gate.sh is the Makefile-only regression harness
  # for scripts/degraded-tools-gate.sh (issue #3207). The detector itself is
  # runtime-referenced from /design, /implement, /review, /research Step 0; the
  # harness is covered by the test-degraded-tools-gate target.
  "scripts/test-degraded-tools-gate.sh",
  "scripts/test-degraded-tools-gate.md",
  # scripts/test-no-grouped-reuse-guard.sh is the Makefile-only post-condition
  # harness for grouped-reuse rip-out; covered by test-no-grouped-reuse-guard.
  "scripts/test-no-grouped-reuse-guard.sh",
  # scripts/test-launch-claude-subprocess.sh is the Makefile-only regression
  # harness for scripts/launch-claude-subprocess.sh. The launcher itself is
  # runtime-referenced from /review; the harness is not invoked from skill
  # prose and is covered by the test-launch-claude-subprocess target.
  "scripts/test-launch-claude-subprocess.sh",
  "scripts/test-launch-claude-subprocess.md",
  # larch-log-batches.sh is sourced by lib-larch-log.sh; agent-lint does not
  # follow Bash source edges.
  "scripts/larch-log-batches.sh",
  "scripts/larch-log-batches.md",
  # read-claude-model.sh is retained as a diagnostic helper for operators; the
  # anchor assembler caller was removed by the larch-log migration.
  "scripts/read-claude-model.sh",
  "scripts/read-claude-model.md",
  # skills/implement/scripts/test-step2-dispatch.sh is the offline regression
  # harness for skills/implement/scripts/step2-implement.sh (the /implement
  # Step 2 dispatcher). Referenced only from Makefile (test-step2-dispatch
  # target), docs/linting.md (operator-facing harness table), and the sibling
  # contract test-step2-dispatch.md. agent-lint's S030/orphaned-skill-files
  # rule wants test-* under skills/<name>/scripts/ to be referenced from the
  # parent SKILL.md, but Larch's convention places test harnesses outside the
  # skill prose surface (they are operator-invocable via `make`, not via the
  # skill's procedural body).
  "skills/implement/scripts/test-step2-dispatch.sh",
  "skills/implement/scripts/test-step2-dispatch.md",
  # .claude/skills/analyze-issues/scripts/test-analyze.sh is the offline
  # regression harness for the dev-only /analyze-issues analyzer. It is
  # referenced from Makefile (test-analyze target) and its sibling contract,
  # not from SKILL.md's runtime prose. The fixture is consumed by the harness.
  ".claude/skills/analyze-issues/scripts/test-analyze.sh",
  ".claude/skills/analyze-issues/scripts/test-analyze.md",
  ".claude/skills/analyze-issues/scripts/test-fixture.json",
  # .claude/skills/audit-runs/scripts/test-audit-runs.sh is the offline harness
  # for the dev-only audit-runs skill. Referenced from Makefile
  # (test-audit-runs target) and its sibling contract; not from SKILL.md
  # runtime prose. Same Makefile-only pattern as test-analyze above.
  ".claude/skills/audit-runs/scripts/test-audit-runs.sh",
  ".claude/skills/audit-runs/scripts/test-audit-runs.md",
  # skills/implement/scripts/test-oos-file-conflict-deps.sh is the fixture
  # harness for oos-file-conflict-deps.sh. Referenced from Makefile
  # (test-oos-file-conflict-deps), docs/linting.md, and the helper's sibling
  # contract; not from SKILL.md's runtime prose.
  "skills/implement/scripts/test-oos-file-conflict-deps.sh",
