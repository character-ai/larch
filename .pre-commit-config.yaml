        # larch-logs/ holds committed run artifacts (e.g. source-env.sh files
        # whose absolute paths have been replaced with <TMPDIR> /
        # <OPERATOR_REPO_PATH> placeholders by redact tmpdir-paths).
        # Those redacted artifacts are not valid shell and must not be
        # shellcheck-linted; they are reference logs, not executable scripts.
        exclude: ^larch-logs/
        require_serial: true
        # Selection (types: [shell]) and -x follow-source semantics match
        # the upstream shellcheck-py hook this replaces. Engine is the
        # same binary (shellcheck-py==0.11.0.1), pinned in the hook env.
        # Parallelism lives in the wrapper; require_serial: true prevents
        # pre-commit from also splitting the file list, which would
        # multiply parallel shellcheck processes against xargs -P.

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  - repo: local
    hooks:
      - id: jsonlint
        name: Validate JSON files
        entry: bash -c 'for f; do jq . "$f" > /dev/null || exit 1; done' --
        language: system
        types: [json]

  - repo: https://github.com/zhupanov/agent-lint
    rev: v2.3.2
    hooks:
      - id: agent-lint
        args: [--pedantic]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # Override upstream's `gitleaks protect --staged` and use
        # `detect --no-git` so the hook scans the working tree (which
        # includes staged/uncommitted content at commit time). `--no-git`
        # is load-bearing: without it, `gitleaks detect` scans only git
        # history and silently passes secrets that are staged but not
        # yet committed. `pass_filenames: false` is intentional — the
        # hook always scans the whole tree, even when pre-commit is
        # invoked with a scoped `--files <path>` argument. Git-history
        # scanning is the dedicated CI job's responsibility (see
        # .github/workflows/ci.yaml `gitleaks` job).
        entry: gitleaks detect --source . --no-git --redact --no-banner
        pass_filenames: false

