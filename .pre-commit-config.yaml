        entry: python3 python/cli.py lint unreachable-branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^python/larch/.*\.py$|^python/unreachable-branch-baseline\.json$

      - id: lint-env-via-config-constant
        name: Lint bare env literals in python/
        entry: python3 python/cli.py lint env-via-config-constant
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^python/.*\.py$

      - id: lint-root-resolution
