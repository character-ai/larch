        # Legacy larch-logs/ fixtures can hold run artifacts (e.g. source-env.sh files
        # whose absolute paths have been replaced with <TMPDIR> /
        # <OPERATOR_REPO_PATH> placeholders by redact tmpdir-paths).
        # Those redacted artifacts are not valid shell and must not be
        # shellcheck-linted; they are reference logs, not executable scripts.
        exclude: ^larch-logs/
        require_serial: true
        # Selection (types: [shell]) and -x follow-source semantics match
        # the upstream shellcheck-py hook this replaces. Engine is the
        # same binary (shellcheck-py==0.11.0.1), pinned in the hook env.
        # Parallelism lives in the wrapper; require_serial: true prevents
        # pre-commit from also splitting the file list, which would
        # multiply parallel shellcheck processes against xargs -P.

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  - repo: local
    hooks:
      - id: jsonlint
        name: Validate JSON files
        entry: bash -c 'for f; do jq . "$f" > /dev/null || exit 1; done' --
        language: system
        types: [json]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (autofix changed Python files)
        entry: ruff check --fix --config python/ruff.toml
        language: python
        additional_dependencies: [ruff==0.15.15]
        files: ^python/.*\.py$
        pass_filenames: true

      - id: pyright
        name: pyright (manual full-project type check)
        # language: system so pyright resolves project + dev deps (e.g. pytest)
        # from the ambient env, mirroring CI's python-pyright job. An isolated
        # additional_dependencies venv can't see those imports and reports
        # spurious reportMissingImports. Runs locally only; CI's lint job SKIPs
        # this hook (pyright is covered by the dedicated python-pyright job).
        entry: pyright --project python/pyrightconfig.json
        language: system
        files: ^python/.*\.py$
        pass_filenames: true
        stages: [manual]

      - id: lint-wire-artifact-pairing
        name: lint wire-artifact-pairing
        entry: python3 python/cli.py lint wire-artifact-pairing
        language: system
        files: ^python/.*\.py$|^scripts/.*|^python/wire-artifact-.*\.json$
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: cargo-fmt
        name: Rust format check
        entry: make rust-fmt
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml|rust-toolchain\.toml|crates/.*(Cargo\.toml|\.rs))$

      - id: cargo-clippy
        name: changed-path Rust Clippy lint
        entry: python3 python/cli.py checks rust-clippy --repo-root .
        language: system
        pass_filenames: true
        verbose: true
        files: ^(Cargo\.(toml|lock)|deny\.toml|rust-toolchain\.toml|\.cargo/.*|crates/.*(Cargo\.toml|\.rs))$

  - repo: https://github.com/zhupanov/agent-lint
    rev: v4.0.2
    hooks:
      - id: agent-lint
        args: [--pedantic]
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (pinned release binary)
        # The shared wrapper downloads and checksum-verifies the same release
        # artifact path used by CI. Its working-tree mode uses `--no-git`, so
        # the hook scans the working tree (which
        # includes staged/uncommitted content at commit time). `--no-git`
        # is load-bearing: without it, `gitleaks detect` scans only git
        # history and silently passes secrets that are staged but not
        # yet committed. This full working-tree scan is manual-only. The
        # dedicated CI job owns both working-tree and commit-range scanning.
        entry: python3 python/cli.py checks gitleaks --mode working-tree
        language: system
        pass_filenames: false
        stages: [manual]

  - repo: local
    hooks:
      - id: larch-lint
        name: larch-lint repository policy rules
        entry: cargo run --quiet --locked --package larch-lint -- all
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: local
    hooks:
      - id: lint-run-log-walkers
        name: Reject raw run-log cache walkers
        entry: python3 python/cli.py lint run-log-walkers
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^(python/.*\.py|skills/fluff-analysis/scripts/fluff-analysis\.py|skills/voter-calibration/scripts/voter-calibration\.py)$

      - id: lint-keyword-only
        name: Lint keyword-only arg enforcement in python/
        entry: python3 python/cli.py lint keyword-only
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^python/[^/]+\.py$

      - id: lint-subprocess-via-runner
