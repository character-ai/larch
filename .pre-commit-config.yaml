        entry: python3 python/cli.py lint root-resolution
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^python/larch/.*\.py$|^python/root-resolution-baseline\.json$

      - id: lint-suppression-reason
        name: Lint suppression comments in python/
        entry: python3 python/cli.py lint suppression-reason
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^(python/.*\.py|python/suppression-reason-baseline\.json)$

      - id: lint-pylint-skip-file
        name: Lint pylint skip-file and module-level R0801 disables in python/larch/
        entry: python3 python/cli.py lint pylint-skip-file
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        files: ^python/larch/.*\.py$|^python/pylint-skip-file-baseline\.json$

