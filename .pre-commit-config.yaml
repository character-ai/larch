  - repo: local
    hooks:
      - id: check-topology-rule-paths
        name: Check topology-rule paths coverage
        entry: python3 python/cli.py lint topology-rule-paths
        language: system
        pass_filenames: false
        files: ^(skills/shared/topology\.tsv|\.claude/rules/topology-generation\.md|python/check_topology_rule_paths\.py)$

  - repo: local
    hooks:
      - id: lint-readability-preamble
        name: lint readability preamble references
        entry: python3 python/cli.py lint readability-preamble
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-renderer-substitution-safety
        name: lint renderer substitution safety
        entry: bash scripts/lint-renderer-substitution-safety.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-skill-md-flag-signature
        name: lint SKILL.md script flag signatures
        entry: python3 python/cli.py lint skill-md-flag-signature
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-bare-grep-probe
        name: lint bare top-level grep in orchestrator markdown fences
        entry: bash scripts/lint-bare-grep-probe.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-codex-exec-auth
        name: lint unwired codex exec call sites
        entry: python3 python/cli.py lint codex-exec-auth
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-consecutive-bash
        name: lint consecutive bash tool-call fences
        entry: python3 python/cli.py lint consecutive-bash
        language: system
        pass_filenames: false
        always_run: true
        files: ^(skills/[^/]+/SKILL\.md|skills/[^/]+/references/[^/]+\.md|\.claude/skills/[^/]+/SKILL\.md)$

      - id: lint-awk-multibyte-regex
        name: lint multi-byte UTF-8 in dynamic awk regex
        entry: bash scripts/lint-awk-multibyte-regex.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: test-legacy-title-prefix-literals-scope
        name: Check legacy title-prefix literal scope
        entry: bash scripts/test-legacy-title-prefix-literals-scope.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: lint-retired-scripts
        name: Lint references to retired script paths
        entry: python3 python/cli.py lint retired-scripts
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: agnix
        name: Lint AI agent configuration files
        entry: agnix . --strict
        language: node
        additional_dependencies: ['agnix@0.17.0']
        pass_filenames: false
        files: |
          (?x)^(
            .*SKILL\.md|
            .*CLAUDE\.md|
            .*CLAUDE\.local\.md|
            .*AGENTS\.md|
            agents/.*\.md|
            \.claude/agents/.*\.md|
            \.claude/rules/.*\.md|
            \.claude/settings\.json|
            \.claude/settings\.local\.json|
            hooks/hooks\.json|
            \.claude-plugin/.*\.json|
            .*\.mcp\.json
          )$
