# Larch pre-commit configuration
# Single source of truth for linter definitions.
# CI lint job uses: make lint-only (repo-wide via pre-commit run --all-files); harness
# matrix runs make test-harnesses-N separately. Local make lint runs test-harnesses
# then lint-only.
# python/cli.py checks run-relevant uses: pre-commit run --files <changed-files> (scoped).
# The default stage accepts only bounded, filename-aware work. Repository-wide
# policy, secret, and agent scans stay in their dedicated CI jobs or manual stage.
# Developers use: pre-commit install (opt-in git hook)

# Legacy larch-logs/ fixtures can hold redacted reviewer prompts, voter outputs,
# and transcripts. They are runtime data, not authored source. Exclude them
# from every file-passing hook so linters never scan it: jsonlint alone spent
# ~80s/run validating ~9.6k larch-logs JSON files, and the larch-logs file
# list (~62k paths) inflated per-hook matching across the whole config.
# The manual gitleaks hook and the dedicated CI gitleaks job scan larch-logs
# independently of this file-passing exclusion. See
# docs/security/artifacts-redaction-and-publication.md.
exclude: ^(\.venv/|node_modules/|larch-logs/|plugin/)

