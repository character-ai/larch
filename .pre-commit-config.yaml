        name: Lint inline gh --body / --notes (.sh/.py)
        entry: python3 python/cli.py lint gh-body-inline
        language: system
        pass_filenames: false
        always_run: true
        files: ^.*\.(sh|py)$

      - id: lint-run-log-run-id
        name: Reject non-unique placeholder run-log run-ids (run-N)
        entry: python3 python/cli.py lint run-log-run-id
        language: system
        pass_filenames: false
        files: ^larch-logs/

      - id: lint-keyword-only
        name: Lint keyword-only arg enforcement in python/
        entry: python3 python/cli.py lint keyword-only
        language: system
        pass_filenames: false
        always_run: true
        files: ^python/[^/]+\.py$

      - id: lint-subprocess-via-runner
        name: Lint direct subprocess calls in python/
        entry: python3 python/cli.py lint subprocess-via-runner
        language: system
        pass_filenames: false
        always_run: true
        files: ^python/.*\.py$

      - id: lint-env-via-config-constant
        name: Lint bare env literals in python/
        entry: python3 python/cli.py lint env-via-config-constant
        language: system
        pass_filenames: false
        always_run: true
        files: ^python/.*\.py$

