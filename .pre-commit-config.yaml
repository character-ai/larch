# Larch pre-commit configuration
# Single source of truth for linter definitions.
# CI lint job uses: make lint-only (repo-wide via pre-commit run --all-files); harness
# matrix runs make test-harnesses-N separately. Local make lint runs test-harnesses
# then lint-only.
# python/cli.py checks run-relevant uses: pre-commit run --files <changed-files> (scoped)
# Developers use: pre-commit install (opt-in git hook)

# larch-logs/ holds committed run-log artifacts (redacted reviewer prompts,
# voter outputs, transcripts) — runtime data, not authored source. Exclude it
# from every file-passing hook so linters never scan it: jsonlint alone spent
# ~80s/run validating ~9.6k larch-logs JSON files, and the larch-logs file
# list (~62k paths) inflated per-hook matching across the whole config.
# Secret scanning still covers larch-logs — the gitleaks pre-commit hook uses
# `--no-git --source .` (pass_filenames: false) and ignores this list, and the
# dedicated CI gitleaks job scans the newly-added subdir. always_run hooks that
# scan internally exclude larch-logs in their own logic. See SECURITY.md.
exclude: ^(\.venv/|node_modules/|larch-logs/)

repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (parallel, pinned binary)
        entry: scripts/pre-commit-shellcheck.sh
        language: python
        additional_dependencies: [shellcheck-py==0.11.0.1]
        types: [shell]
        # larch-logs/ holds committed run artifacts (e.g. source-env.sh files
        # whose absolute paths have been replaced with <TMPDIR> /
        # <OPERATOR_REPO_PATH> placeholders by redact tmpdir-paths).
        # Those redacted artifacts are not valid shell and must not be
        # shellcheck-linted; they are reference logs, not executable scripts.
        exclude: ^larch-logs/
        require_serial: true
        # Selection (types: [shell]) and -x follow-source semantics match
        # the upstream shellcheck-py hook this replaces. Engine is the
        # same binary (shellcheck-py==0.11.0.1), pinned in the hook env.
        # Parallelism lives in the wrapper; require_serial: true prevents
        # pre-commit from also splitting the file list, which would
        # multiply parallel shellcheck processes against xargs -P.

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  - repo: local
    hooks:
      - id: jsonlint
        name: Validate JSON files
        entry: bash -c 'for f; do jq . "$f" > /dev/null || exit 1; done' --
        language: system
        types: [json]

  - repo: https://github.com/zhupanov/agent-lint
    rev: v2.3.2
    hooks:
      - id: agent-lint
        args: [--pedantic]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # Override upstream's `gitleaks protect --staged` and use
        # `detect --no-git` so the hook scans the working tree (which
        # includes staged/uncommitted content at commit time). `--no-git`
        # is load-bearing: without it, `gitleaks detect` scans only git
        # history and silently passes secrets that are staged but not
        # yet committed. `pass_filenames: false` is intentional — the
        # hook always scans the whole tree, even when pre-commit is
        # invoked with a scoped `--files <path>` argument. Git-history
        # scanning is the dedicated CI job's responsibility (see
        # .github/workflows/ci.yaml `gitleaks` job).
        entry: gitleaks detect --source . --no-git --redact --no-banner
        pass_filenames: false

  - repo: local
    hooks:
      - id: lint-mermaid-fences
        name: lint mermaid fences
        entry: python3 python/cli.py lint mermaid-fences
        language: system
        types: [markdown]
        pass_filenames: true

  - repo: local
    hooks:
      - id: lint-skill-invocations
        name: Lint skill-invocation docs
        entry: python3 python/cli.py lint skill-invocations
        language: system
        pass_filenames: false
        always_run: true
        files: ^(skills|\.claude/skills)/[^/]+/SKILL\.md$

  - repo: local
    hooks:
      - id: lint-literal-counts
        name: Lint drift-prone literal item counts in markdown
        entry: python scripts/lint-literal-counts.py
        language: python
        pass_filenames: false
        always_run: true
        files: \.md$

  - repo: local
    hooks:
      - id: lint-no-raw-stderr-after-quiet-init
        name: Lint raw stderr after larch_quiet_init
        entry: python scripts/lint-no-raw-stderr-after-quiet-init.py
        language: python
        pass_filenames: false
        always_run: true
        files: ^(scripts/.*\.sh|hooks/.*\.sh|skills/[^/]+/scripts/.*\.sh)$

  - repo: local
    hooks:
      - id: lint-gh-body-inline
        name: Lint inline gh --body / --notes (.sh/.py)
        entry: python3 python/cli.py lint gh-body-inline
        language: system
        pass_filenames: false
        always_run: true
        files: ^.*\.(sh|py)$

      - id: lint-run-log-run-id
        name: Reject non-unique placeholder run-log run-ids (run-N)
        entry: python3 python/cli.py lint run-log-run-id
        language: system
        pass_filenames: false
        files: ^larch-logs/

      - id: lint-bash32
        name: Lint Bash 3.2 portability of shell scripts
        entry: bash scripts/lint-bash32.sh
        language: system
        files: \.(sh|inc\.bash)$
        pass_filenames: true

      - id: bash-syntax-check
        name: bash syntax check (-n)
        entry: scripts/pre-commit-bash-syntax.sh
        language: system
        types: [shell]
        exclude: ^larch-logs/
        require_serial: true

  - repo: local
    hooks:
      - id: check-topology-rule-paths
        name: Check topology-rule paths coverage
        entry: python scripts/check-topology-rule-paths.py
        language: python
        additional_dependencies: ['pyyaml==6.0.2']
        pass_filenames: false
        files: ^(skills/shared/topology\.tsv|\.claude/rules/topology-generation\.md|scripts/check-topology-rule-paths\.py)$

  - repo: local
    hooks:
      - id: lint-readability-preamble
        name: lint readability preamble references
        entry: python3 python/cli.py lint readability-preamble
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-renderer-substitution-safety
        name: lint renderer substitution safety
        entry: bash scripts/lint-renderer-substitution-safety.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-skill-md-flag-signature
        name: lint SKILL.md script flag signatures
        entry: python3 python/cli.py lint skill-md-flag-signature
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-bare-grep-probe
        name: lint bare top-level grep in orchestrator markdown fences
        entry: bash scripts/lint-bare-grep-probe.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-codex-exec-auth
        name: lint unwired codex exec call sites
        entry: python3 python/cli.py lint codex-exec-auth
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-awk-multibyte-regex
        name: lint multi-byte UTF-8 in dynamic awk regex
        entry: bash scripts/lint-awk-multibyte-regex.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: lint-retired-scripts
        name: Lint references to retired script paths
        entry: python3 python/cli.py lint retired-scripts
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: agnix
        name: Lint AI agent configuration files
        entry: agnix . --strict
        language: node
        additional_dependencies: ['agnix@0.17.0']
        pass_filenames: false
        files: |
          (?x)^(
            .*SKILL\.md|
            .*CLAUDE\.md|
            .*CLAUDE\.local\.md|
            .*AGENTS\.md|
            agents/.*\.md|
            \.claude/agents/.*\.md|
            \.claude/rules/.*\.md|
            \.claude/settings\.json|
            \.claude/settings\.local\.json|
            hooks/hooks\.json|
            \.claude-plugin/.*\.json|
            .*\.mcp\.json
          )$
