title = "larch gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures (scripts/test-redact-secrets.sh, scripts/test-tracking-issue-write.md, scripts/test-relevant-checks-helper-failure.sh, skills/issue/scripts/test-add-blocked-by.sh, scripts/test-ship-pr.sh, skills/review-and-fix/scripts/test-review-and-fix.sh, skills/review/scripts/test-review-core.sh), redaction-scanner source (scripts/redact-secrets.sh), tracking-issue-write lifecycle helper and its contract doc (scripts/tracking-issue-write.sh, scripts/tracking-issue-write.md), committed run-logs (larch-logs/**) which contain UUID-shaped LARCH_TOKEN_SESSION_ID values that trigger generic-api-key false positives, and the .gitleaks.toml self-allowlist — these paths legitimately contain token-shaped strings throughout. Documentation files (README.md, CHANGELOG.md, SECURITY.md, skills/issue/SKILL.md, skills/issue/scripts/create-one.sh) are intentionally NOT allowlisted — see SECURITY.md 'Layered secret scanning' (#375)."
paths = [
    '''^\.gitleaks\.toml$''',
    '''^scripts/redact-secrets\.sh$''',
    '''^scripts/test-redact-secrets\.sh$''',
    '''^scripts/test-relevant-checks-helper-failure\.sh$''',
    '''^scripts/tracking-issue-write\.sh$''',
    '''^scripts/tracking-issue-write\.md$''',
    '''^scripts/test-tracking-issue-write\.md$''',
    '''^skills/issue/scripts/test-add-blocked-by\.sh$''',
    '''^larch-logs/''',
    '''^scripts/test-ship-pr\.sh$''',
    '''^skills/review-and-fix/scripts/test-review-and-fix\.sh$''',
    '''^skills/review/scripts/test-review-core\.sh$''',
]
# Synthetic test-fixture key used in redaction harnesses.
# The value is obviously fake (sequential alphabet + digits) and appears in test
# scripts and changelog prose describing the fixture, not in production code.
stopwords = [
    "abcdefghijklmnopqrstuvwxyz0123456789ABCD",
]
regexes = [
    '''sk-ant-abcdefghijklmnopqrstuvwxyz0123456789ABCD''',
    '''abcdefghijklmnopqrstuvwxyz0123456789ABCD''',
]
